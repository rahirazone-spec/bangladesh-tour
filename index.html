    <style>

            margin: 0;
            padding: 0;

        body {

        /* =========================
           HOME
        ========================= */

        .hero {

            background-image:

        /* =========================
           CAMERA
        ========================= */

        #cameraScreen {

            position: fixed;

        #cameraVideo {

            inset: 0;

            object-fit: cover;

            padding:

        /* =========================

                white-space: normal;

        }

    </style>

</head>

    <!-- =========================
         JAVASCRIPT
    ========================= -->

    <script>


        /* =========================
           ELEMENTS
        ========================= */

        const cameraScreen =
            document.getElementById(
                "cameraScreen"
            );

        const cameraVideo =
            document.getElementById(
                "cameraVideo"
            );

        const cameraTitle =
            document.getElementById(
                "cameraTitle"
            );

        const cameraLoading =
            document.getElementById(
                "cameraLoading"
            );

        const captureButton =
            document.getElementById(
                "captureButton"
            );

        const closeCamera =
            document.getElementById(
                "closeCamera"
            );

        const resultScreen =
            document.getElementById(
                "resultScreen"
            );

        const resultCanvas =
            document.getElementById(
                "resultCanvas"
            );

        const saveButton =
            document.getElementById(
                "saveButton"
            );

        const againButton =
            document.getElementById(
                "againButton"
            );


        /* =========================
           VARIABLES
        ========================= */

        let stream = null;

        let selectedPlace = null;

        let isCapturing = false;

        let segmentation = null;

        let segmentationReady = false;

        let mediaPipeLoading = null;


        /* =========================
           DESTINATIONS
        ========================= */

        const places = {

            cox: {

                name:
                    "কক্সবাজার",

                image:
                    "images/coxs-bazar.jpg"

            },

            sylhet: {

                name:
                    "সিলেট",

                image:
                    "images/sylhet.jpg"

            },

            sundarbans: {

                name:
                    "সুন্দরবন",

                image:
                    "images/sundarbans.jpg"

            }

        };


        /* =========================
           LOAD MEDIAPIPE
        ========================= */

        function loadMediaPipe() {

            if (
                typeof SelfieSegmentation !==
                "undefined"
            ) {

                return Promise.resolve(
                    true
                );

            }


            if (mediaPipeLoading) {

                return mediaPipeLoading;

            }


            mediaPipeLoading =
                new Promise(
                    function(resolve) {

                        const script =
                            document.createElement(
                                "script"
                            );


                        script.src =
                            "https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js";


                        script.crossOrigin =
                            "anonymous";


                        script.onload =
                            function() {

                                console.log(
                                    "MediaPipe loaded"
                                );

                                resolve(
                                    true
                                );

                            };


                        script.onerror =
                            function() {

                                console.error(
                                    "MediaPipe load failed"
                                );

                                resolve(
                                    false
                                );

                            };


                        document.head.appendChild(
                            script
                        );

                    }
                );


            return mediaPipeLoading;

        }


        /* =========================
           INITIALIZE AI
        ========================= */

        function initializeAI() {

            try {

                if (
                    typeof SelfieSegmentation ===
                    "undefined"
                ) {

                    segmentationReady =
                        false;

                    return false;

                }


                if (segmentation) {

                    return true;

                }


                segmentation =
                    new SelfieSegmentation({

                        locateFile:
                            function(file) {

                                return (
                                    "https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/" +
                                    file
                                );

                            }

                    });


                segmentation.setOptions({

                    modelSelection: 0

                });


                segmentationReady =
                    true;


                console.log(
                    "MediaPipe AI Ready"
                );


                return true;

            }

            catch (error) {

                console.error(
                    "AI initialization error:",
                    error
                );


                segmentationReady =
                    false;


                return false;

            }

        }


        /* =========================
           DESTINATION CLICK
        ========================= */

        document
            .querySelectorAll(
                ".destination-card"
            )
            .forEach(
                function(card) {

                    card.addEventListener(
                        "click",
                        function() {

                            const place =
                                card.dataset.place;

                            startCamera(
                                place
                            );

                        }
                    );

                }
            );


        /* =========================
           START CAMERA
        ========================= */

        async function startCamera(place) {

            console.log(
                "startCamera:",
                place
            );


            if (!places[place]) {

                console.error(
                    "Invalid destination"
                );

                return;

            }


            selectedPlace =
                place;


            isCapturing =
                false;


            captureButton.disabled =
                false;


            cameraTitle.innerText =
                "📍 " +
                places[place].name;


            cameraLoading.innerText =
                "ক্যামেরা চালু হচ্ছে...";


            cameraLoading.style.display =
                "block";


            resultScreen.style.display =
                "none";


            cameraScreen.style.display =
                "block";


            stopCameraOnly();


            try {

                if (
                    !window.isSecureContext &&
                    location.hostname !==
                        "localhost"
                ) {

                    throw new Error(
                        "ক্যামেরার জন্য HTTPS প্রয়োজন।"
                    );

                }


                if (
                    !navigator.mediaDevices ||
                    !navigator.mediaDevices.getUserMedia
                ) {

                    throw new Error(
                        "এই browser-এ Camera API পাওয়া যাচ্ছে না।"
                    );

                }


                stream =
                    await navigator
                        .mediaDevices
                        .getUserMedia({

                            video: {

                                facingMode:
                                    {
                                        ideal:
                                            "user"
                                    },

                                width: {

                                    ideal:
                                        1280

                                },

                                height: {

                                    ideal:
                                        720

                                }

                            },

                            audio:
                                false

                        });


                cameraVideo.srcObject =
                    stream;


                await new Promise(
                    function(resolve) {

                        if (
                            cameraVideo.readyState >=
                            1
                        ) {

                            resolve();

                            return;

                        }


                        cameraVideo.onloadedmetadata =
                            function() {

                                resolve();

                            };

                    }
                );


                await cameraVideo.play();


                cameraLoading.style.display =
                    "none";


                console.log(
                    "Camera ready:",
                    cameraVideo.videoWidth,
                    cameraVideo.videoHeight
                );

            }

            catch (error) {

                console.error(
                    "Camera error:",
                    error
                );


                cameraLoading.innerText =
                    "ক্যামেরা চালু করা যায়নি।";


                alert(
                    "ক্যামেরা চালু করা যায়নি।\n\n" +
                    error.message
                );

            }

        }


        /* =========================
           CAPTURE PHOTO
        ========================= */

        async function capturePhoto() {

            if (isCapturing) {

                return;

            }


            isCapturing =
                true;


            captureButton.disabled =
                true;


            cameraLoading.style.display =
                "block";


            try {

                if (!stream) {

                    throw new Error(
                        "Camera stream পাওয়া যায়নি।"
                    );

                }


                if (
                    cameraVideo.videoWidth === 0 ||
                    cameraVideo.videoHeight === 0
                ) {

                    throw new Error(
                        "Camera এখনও প্রস্তুত নয়।"
                    );

                }


                /* =========================
                   LOW RESOLUTION SOURCE
                ========================= */

                const sourceCanvas =
                    document.createElement(
                        "canvas"
                    );


                const originalWidth =
                    cameraVideo.videoWidth;


                const originalHeight =
                    cameraVideo.videoHeight;


                /*
                 * AI-এর জন্য সর্বোচ্চ 640px।
                 * এতে মোবাইলে অনেক দ্রুত processing হবে।
                 */

                const MAX_SIZE =
                    640;


                const scale =
                    Math.min(

                        1,

                        MAX_SIZE /
                        Math.max(
                            originalWidth,
                            originalHeight
                        )

                    );


                sourceCanvas.width =
                    Math.round(
                        originalWidth *
                        scale
                    );


                sourceCanvas.height =
                    Math.round(
                        originalHeight *
                        scale
                    );


                const sourceCtx =
                    sourceCanvas.getContext(
                        "2d"
                    );


                /*
                 * Front camera mirror.
                 */

                sourceCtx.save();


                sourceCtx.translate(
                    sourceCanvas.width,
                    0
                );


                sourceCtx.scale(
                    -1,
                    1
                );


                sourceCtx.drawImage(

                    cameraVideo,

                    0,
                    0,

                    sourceCanvas.width,
                    sourceCanvas.height

                );


                sourceCtx.restore();


                /* =========================
                   LOAD AI
                ========================= */

                cameraLoading.innerText =
                    "AI প্রস্তুত হচ্ছে...";


                const loaded =
                    await loadMediaPipe();


                if (!loaded) {

                    throw new Error(
                        "AI load হয়নি। Internet connection পরীক্ষা করুন।"
                    );

                }


                if (!initializeAI()) {

                    throw new Error(
                        "AI initialize করা যায়নি।"
                    );

                }


                /* =========================
                   SEGMENT
                ========================= */

                cameraLoading.innerText =
                    "Background remove হচ্ছে...";


                const results =
                    await runSegmentation(
                        sourceCanvas
                    );


                if (
                    !results ||
                    !results.segmentationMask
                ) {

                    throw new Error(
                        "AI মানুষ শনাক্ত করতে পারেনি।"
                    );

                }


                /* =========================
                   PERSON CUTOUT
                ========================= */

                const personCanvas =
                    createPersonCutout(

                        sourceCanvas,

                        results.segmentationMask

                    );


                /*
                 * Camera বন্ধ।
                 */

                stopCameraOnly();


                cameraLoading.innerText =
                    "Final photo তৈরি হচ্ছে...";


                await createFinalImage(
                    personCanvas
                );

            }

            catch (error) {

                console.error(
                    "Capture error:",
                    error
                );


                alert(
                    "ছবি তৈরির সময় সমস্যা হয়েছে।\n\n" +
                    error.message
                );


                isCapturing =
                    false;


                captureButton.disabled =
                    false;


                cameraLoading.style.display =
                    "none";

            }

        }


        /* =========================
           SEGMENTATION
        ========================= */

        function runSegmentation(image) {

            return new Promise(
                function(resolve, reject) {

                    let finished =
                        false;


                    if (!segmentation) {

                        reject(
                            new Error(
                                "AI পাওয়া যায়নি।"
                            )
                        );

                        return;

                    }


                    segmentation.onResults =
                        function(results) {

                            if (finished) {

                                return;

                            }


                            finished =
                                true;


                            resolve(
                                results
                            );

                        };


                    segmentation
                        .send({
                            image: image
                        })
                        .catch(
                            function(error) {

                                if (
                                    finished
                                ) {

                                    return;

                                }


                                finished =
                                    true;


                                reject(
                                    error
                                );

                            }
                        );


                    /*
                     * Mobile-এ প্রথমবার
                     * AI model load হতে সময়
                     * লাগতে পারে।
                     */

                    setTimeout(
                        function() {

                            if (
                                finished
                            ) {

                                return;

                            }


                            finished =
                                true;


                            reject(
                                new Error(
                                    "AI processing করতে বেশি সময় লাগছে। আবার ছবি তুলুন।"
                                )
                            );

                        },
                        30000
                    );

                }
            );

        }


        /* =========================
           CREATE PERSON CUTOUT
        ========================= */

        function createPersonCutout(
            sourceCanvas,
            mask
        ) {

            const width =
                sourceCanvas.width;


            const height =
                sourceCanvas.height;


            const maskCanvas =
                document.createElement(
                    "canvas"
                );


            maskCanvas.width =
                width;


            maskCanvas.height =
                height;


            const maskCtx =
                maskCanvas.getContext(
                    "2d",
                    {
                        willReadFrequently:
                            true
                    }
                );


            maskCtx.drawImage(

                mask,

                0,
                0,

                width,
                height

            );


            const maskData =
                maskCtx.getImageData(

                    0,
                    0,

                    width,
                    height

                );


            const pixels =
                maskData.data;


            /*
             * Mask brightness
             * → Alpha
             */

            for (
                let i = 0;
                i < pixels.length;
                i += 4
            ) {

                const brightness =
                    (
                        pixels[i] +
                        pixels[i + 1] +
                        pixels[i + 2]
                    ) / 3;


                let alpha;


                if (
                    brightness < 40
                ) {

                    alpha = 0;

                }

                else if (
                    brightness > 160
                ) {

                    alpha = 255;

                }

                else {

                    alpha =
                        (
                            (
                                brightness -
                                40
                            ) /
                            120
                        ) *
                        255;

                }


                pixels[i] =
                    255;

                pixels[i + 1] =
                    255;

                pixels[i + 2] =
                    255;

                pixels[i + 3] =
                    Math.max(
                        0,
                        Math.min(
                            255,
                            alpha
                        )
                    );

            }


            maskCtx.putImageData(
                maskData,
                0,
                0
            );


            /*
             * Person canvas
             */

            const personCanvas =
                document.createElement(
                    "canvas"
                );


            personCanvas.width =
                width;


            personCanvas.height =
                height;


            const personCtx =
                personCanvas.getContext(
                    "2d"
                );


            personCtx.drawImage(

                sourceCanvas,

                0,
                0,

                width,
                height

            );


            /*
             * Keep only person
             */

            personCtx.globalCompositeOperation =
                "destination-in";


            personCtx.drawImage(

                maskCanvas,

                0,
                0,

                width,
                height

            );


            personCtx.globalCompositeOperation =
                "source-over";


            return personCanvas;

        }


        /* =========================
           FIND PERSON BOUNDS
        ========================= */

        function findPersonBounds(
            canvas
        ) {

            const ctx =
                canvas.getContext(
                    "2d",
                    {
                        willReadFrequently:
                            true
                    }
                );


            const width =
                canvas.width;


            const height =
                canvas.height;


            const imageData =
                ctx.getImageData(

                    0,
                    0,

                    width,
                    height

                );


            const data =
                imageData.data;


            let minX =
                width;

            let minY =
                height;

            let maxX =
                0;

            let maxY =
                0;

            let found =
                false;


            const threshold =
                30;


            /*
             * প্রতি 4px করে scan
             * → দ্রুত
             */

            for (
                let y = 0;
                y < height;
                y += 4
            ) {

                for (
                    let x = 0;
                    x < width;
                    x += 4
                ) {

                    const index =
                        (
                            y *
                            width +
                            x
                        ) * 4;


                    const alpha =
                        data[
                            index + 3
                        ];


                    if (
                        alpha >
                        threshold
                    ) {

                        found =
                            true;


                        minX =
                            Math.min(
                                minX,
                                x
                            );


                        minY =
                            Math.min(
                                minY,
                                y
                            );


                        maxX =
                            Math.max(
                                maxX,
                                x
                            );


                        maxY =
                            Math.max(
                                maxY,
                                y
                            );

                    }

                }

            }


            if (!found) {

                return null;

            }


            const margin =
                12;


            minX =
                Math.max(
                    0,
                    minX - margin
                );


            minY =
                Math.max(
                    0,
                    minY - margin
                );


            maxX =
                Math.min(
                    width - 1,
                    maxX + margin
                );


            maxY =
                Math.min(
                    height - 1,
                    maxY + margin
                );


            return {

                x:
                    minX,

                y:
                    minY,

                width:
                    maxX -
                    minX +
                    1,

                height:
                    maxY -
                    minY +
                    1

            };

        }


        /* =========================
           CREATE FINAL IMAGE
        ========================= */

        async function createFinalImage(
            person
        ) {

            const place =
                places[
                    selectedPlace
                ];


            const background =
                new Image();


            background.src =
                place.image;


            await new Promise(
                function(resolve, reject) {

                    background.onload =
                        resolve;


                    background.onerror =
                        function() {

                            reject(
                                new Error(
                                    "Destination image load হয়নি।"
                                )
                            );

                        };

                }
            );


            const canvas =
                resultCanvas;


            const ctx =
                canvas.getContext(
                    "2d"
                );


            canvas.width =
                1080;


            canvas.height =
                1350;


            /*
             * Destination background
             */

            drawCover(

                ctx,

                background,

                0,
                0,

                1080,
                1350

            );


            /*
             * Person bounds
             */

            const bounds =
                findPersonBounds(
                    person
                );


            if (!bounds) {

                throw new Error(
                    "মানুষ শনাক্ত করা যায়নি। ক্যামেরার সামনে দাঁড়িয়ে আবার চেষ্টা করুন।"
                );

            }


            /*
             * Crop person
             */

            const croppedPerson =
                document.createElement(
                    "canvas"
                );


            croppedPerson.width =
                bounds.width;


            croppedPerson.height =
                bounds.height;


            const personCtx =
                croppedPerson.getContext(
                    "2d"
                );


            personCtx.drawImage(

                person,

                bounds.x,
                bounds.y,

                bounds.width,
                bounds.height,

                0,
                0,

                bounds.width,
                bounds.height

            );


            /*
             * Person size
             */

            const maxWidth =
                850;


            const maxHeight =
                1050;


            let personWidth =
                croppedPerson.width;


            let personHeight =
                croppedPerson.height;


            const scale =
                Math.min(

                    maxWidth /
                        personWidth,

                    maxHeight /
                        personHeight,

                    1

                );


            personWidth *=
                scale;


            personHeight *=
                scale;


            /*
             * Position
             */

            const personX =
                (
                    1080 -
                    personWidth
                ) / 2;


            const personY =
                1280 -
                personHeight;


            /*
             * Shadow
             */

            ctx.save();


            ctx.globalAlpha =
                0.16;


            ctx.filter =
                "blur(18px)";


            ctx.drawImage(

                croppedPerson,

                personX + 12,

                personY + 18,

                personWidth,

                personHeight

            );


            ctx.restore();


            /*
             * Person
             */

            ctx.drawImage(

                croppedPerson,

                personX,

                personY,

                personWidth,

                personHeight

            );


            /*
             * Bottom gradient
             */

            const gradient =
                ctx.createLinearGradient(

                    0,
                    850,

                    0,
                    1350

                );


            gradient.addColorStop(

                0,

                "rgba(0,0,0,0)"

            );


            gradient.addColorStop(

                1,

                "rgba(0,0,0,.75)"

            );


            ctx.fillStyle =
                gradient;


            ctx.fillRect(

                0,
                850,

                1080,
                500

            );


            /*
             * Destination name
             */

            ctx.fillStyle =
                "#ffffff";


            ctx.font =
                "800 58px 'Noto Sans Bengali', sans-serif";


            ctx.textAlign =
                "center";


            ctx.fillText(

                place.name,

                540,

                1220

            );


            /*
             * Footer
             */

            ctx.font =
                "500 28px 'Noto Sans Bengali', sans-serif";


            ctx.fillText(

                "ইন্সট্যান্ট বাংলাদেশ টুর",

                540,

                1275

            );


            /*
             * Result screen
             */

            resultScreen.style.display =
                "block";


            isCapturing =
                false;


            captureButton.disabled =
                false;

        }


        /* =========================
           DRAW COVER
        ========================= */

        function drawCover(

            ctx,
            image,
            x,
            y,
            width,
            height

        ) {

            const imageRatio =
                image.width /
                image.height;


            const boxRatio =
                width /
                height;


            let drawWidth;

            let drawHeight;

            let drawX;

            let drawY;


            if (
                imageRatio >
                boxRatio
            ) {

                drawHeight =
                    height;


                drawWidth =
                    height *
                    imageRatio;


                drawX =
                    x +
                    (
                        width -
                        drawWidth
                    ) / 2;


                drawY =
                    y;

            }

            else {

                drawWidth =
                    width;


                drawHeight =
                    width /
                    imageRatio;


                drawX =
                    x;


                drawY =
                    y +
                    (
                        height -
                        drawHeight
                    ) / 2;

            }


            ctx.drawImage(

                image,

                drawX,
                drawY,

                drawWidth,
                drawHeight

            );

        }


        /* =========================
           STOP CAMERA
        ========================= */

        function stopCameraOnly() {

            if (stream) {

                stream
                    .getTracks()
                    .forEach(
                        function(track) {

                            track.stop();

                        }
                    );

            }


            stream =
                null;


            cameraVideo.srcObject =
                null;

        }


        /* =========================
           CLOSE CAMERA
        ========================= */

        closeCamera.addEventListener(
            "click",
            function() {

                stopCameraOnly();


                cameraScreen.style.display =
                    "none";


                isCapturing =
                    false;


                captureButton.disabled =
                    false;

            }
        );


        /* =========================
           CAPTURE BUTTON
        ========================= */

        captureButton.addEventListener(
            "click",
            function(event) {

                event.preventDefault();

                event.stopPropagation();

                capturePhoto();

            }
        );


        captureButton.addEventListener(
            "touchend",
            function(event) {

                event.preventDefault();

                event.stopPropagation();


                if (!isCapturing) {

                    capturePhoto();

                }

            },
            {
                passive: false
            }
        );


        /* =========================
           SAVE
        ========================= */

        saveButton.addEventListener(
            "click",
            function() {

                const link =
                    document.createElement(
                        "a"
                    );


                link.download =
                    "instant-bangladesh-tour.png";


                link.href =
                    resultCanvas.toDataURL(
                        "image/png"
                    );


                link.click();

            }
        );


        /* =========================
           AGAIN
        ========================= */

        againButton.addEventListener(
            "click",
            function() {

                resultScreen.style.display =
                    "none";


                isCapturing =
                    false;


                captureButton.disabled =
                    false;


                if (selectedPlace) {

                    startCamera(
                        selectedPlace
                    );

                }

            }
        );


    </script>
