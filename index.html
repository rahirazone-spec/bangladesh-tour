<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ইন্সট্যান্ট বাংলাদেশ টুর</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    background:#f5f7fa;
    color:#111;
}

button{
    font-family:inherit;
}

#homeScreen{
    min-height:100vh;
    background:#fff;
}

.hero{
    min-height:55vh;
    padding:50px 20px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    background:
        linear-gradient(rgba(0,0,0,.25),rgba(0,0,0,.45)),
        url("images/hero.jpg") center/cover;
    color:white;
}

.hero h1{
    font-size:clamp(34px,7vw,72px);
    margin-bottom:15px;
    font-weight:800;
}

.hero p{
    font-size:clamp(18px,3vw,28px);
}

.destinations{
    padding:40px 20px 60px;
    max-width:1100px;
    margin:auto;
}

.destinations h2{
    text-align:center;
    margin-bottom:30px;
    font-size:30px;
}

.destination-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
}

.destination-card{
    border:0;
    border-radius:18px;
    overflow:hidden;
    background:white;
    box-shadow:0 8px 30px rgba(0,0,0,.12);
    cursor:pointer;
    padding:0;
    text-align:left;
    transition:.2s;
}

.destination-card:active{
    transform:scale(.97);
}

.destination-card img{
    width:100%;
    height:230px;
    object-fit:cover;
    display:block;
}

.destination-info{
    padding:18px;
}

.destination-info h3{
    font-size:22px;
    margin-bottom:6px;
}

.destination-info p{
    color:#666;
}

#cameraScreen,
#resultScreen{
    display:none;
    position:fixed;
    inset:0;
    z-index:1000;
    background:#000;
}

.camera-wrapper{
    width:100%;
    height:100%;
    position:relative;
    overflow:hidden;
}

#cameraVideo{
    width:100%;
    height:100%;
    object-fit:cover;
    transform:scaleX(-1);
    background:#111;
}

.camera-top{
    position:absolute;
    top:0;
    left:0;
    right:0;
    padding:20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    z-index:5;
    background:linear-gradient(rgba(0,0,0,.65),transparent);
    color:white;
}

.camera-top h2{
    font-size:20px;
}

.close-btn{
    width:44px;
    height:44px;
    border-radius:50%;
    border:0;
    background:rgba(0,0,0,.5);
    color:white;
    font-size:25px;
    cursor:pointer;
}

.camera-bottom{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    padding:30px 20px 40px;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(transparent,rgba(0,0,0,.75));
    z-index:5;
}

.capture-btn{
    width:78px;
    height:78px;
    border-radius:50%;
    border:6px solid white;
    background:#fff;
    box-shadow:0 0 0 3px rgba(255,255,255,.3);
    cursor:pointer;
}

.capture-btn:active{
    transform:scale(.92);
}

#cameraLoading{
    position:absolute;
    inset:0;
    z-index:10;
    display:none;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:30px;
    color:white;
    background:rgba(0,0,0,.72);
}

.loading-box{
    max-width:320px;
}

.spinner{
    width:50px;
    height:50px;
    border:5px solid rgba(255,255,255,.3);
    border-top-color:white;
    border-radius:50%;
    animation:spin 1s linear infinite;
    margin:0 auto 20px;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

#resultScreen{
    overflow:auto;
    background:#111;
}

.result-wrapper{
    min-height:100%;
    padding:20px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
}

#resultCanvas{
    display:block;
    width:min(100%,540px);
    height:auto;
    border-radius:15px;
    box-shadow:0 15px 50px rgba(0,0,0,.5);
}

.result-buttons{
    display:flex;
    gap:12px;
    margin-top:20px;
    width:min(100%,540px);
}

.result-buttons button{
    flex:1;
    padding:15px 12px;
    border:0;
    border-radius:10px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

#saveButton{
    background:#fff;
    color:#111;
}

#againButton{
    background:#2b2b2b;
    color:#fff;
}

@media(max-width:700px){
    .destination-grid{
        grid-template-columns:1fr;
    }

    .destination-card img{
        height:210px;
    }
}
</style>
</head>

<body>

<!-- ================= HOME ================= -->

<section id="homeScreen">

    <div class="hero">
        <h1>ইন্সট্যান্ট বাংলাদেশ টুর</h1>
        <p>ছবি তুলুন। মুহূর্তেই ঘুরে আসুন বাংলাদেশ।</p>
    </div>

    <div class="destinations">

        <h2>কোথায় যেতে চান?</h2>

        <div class="destination-grid">

            <button class="destination-card" data-place="cox">
                <img src="images/coxs-bazar.jpg" alt="কক্সবাজার">
                <div class="destination-info">
                    <h3>কক্সবাজার</h3>
                    <p>সমুদ্রের কাছে চলে যান</p>
                </div>
            </button>

            <button class="destination-card" data-place="sylhet">
                <img src="images/sylhet.jpg" alt="সিলেট">
                <div class="destination-info">
                    <h3>সিলেট</h3>
                    <p>সবুজের রাজ্যে ঘুরে আসুন</p>
                </div>
            </button>

            <button class="destination-card" data-place="sundarbans">
                <img src="images/sundarbans.jpg" alt="সুন্দরবন">
                <div class="destination-info">
                    <h3>সুন্দরবন</h3>
                    <p>প্রকৃতির গভীরে চলে যান</p>
                </div>
            </button>

        </div>
    </div>

</section>


<!-- ================= CAMERA ================= -->

<section id="cameraScreen">

    <div class="camera-wrapper">

        <video
            id="cameraVideo"
            autoplay
            playsinline
            muted>
        </video>

        <div class="camera-top">

            <h2 id="cameraTitle">
                কক্সবাজার
            </h2>

            <button
                id="closeCamera"
                class="close-btn">
                ×
            </button>

        </div>

        <div id="cameraLoading">

            <div class="loading-box">

                <div class="spinner"></div>

                <div id="loadingText">
                    Background remove হচ্ছে...
                </div>

            </div>

        </div>

        <div class="camera-bottom">

            <button
                id="captureButton"
                class="capture-btn"
                aria-label="ছবি তুলুন">
            </button>

        </div>

    </div>

</section>


<!-- ================= RESULT ================= -->

<section id="resultScreen">

    <div class="result-wrapper">

        <canvas
            id="resultCanvas"
            width="1080"
            height="1350">
        </canvas>

        <div class="result-buttons">

            <button id="againButton">
                আবার ছবি তুলুন
            </button>

            <button id="saveButton">
                ছবি সেভ করুন
            </button>

        </div>

    </div>

</section>


<script>

"use strict";


/* =========================================
   DESTINATION DATA
========================================= */

const destinations = {

    cox: {
        name: "কক্সবাজার",
        image: "images/coxs-bazar.jpg"
    },

    sylhet: {
        name: "সিলেট",
        image: "images/sylhet.jpg"
    },

    sundarbans: {
        name: "সুন্দরবন",
        image: "images/sundarbans.jpg"
    }

};


/* =========================================
   ELEMENTS
========================================= */

const homeScreen =
    document.getElementById("homeScreen");

const cameraScreen =
    document.getElementById("cameraScreen");

const resultScreen =
    document.getElementById("resultScreen");

const cameraVideo =
    document.getElementById("cameraVideo");

const cameraTitle =
    document.getElementById("cameraTitle");

const closeCamera =
    document.getElementById("closeCamera");

const captureButton =
    document.getElementById("captureButton");

const cameraLoading =
    document.getElementById("cameraLoading");

const loadingText =
    document.getElementById("loadingText");

const resultCanvas =
    document.getElementById("resultCanvas");

const saveButton =
    document.getElementById("saveButton");

const againButton =
    document.getElementById("againButton");


/* =========================================
   VARIABLES
========================================= */

let currentPlace = null;

let currentStream = null;

let selfieSegmentation = null;

let mediaPipePromise = null;

let aiReady = false;


/* =========================================
   MEDIA PIPE LOAD
========================================= */

function loadMediaPipe(){

    if(mediaPipePromise){
        return mediaPipePromise;
    }

    mediaPipePromise = new Promise(function(resolve, reject){

        if(
            typeof SelfieSegmentation !== "undefined"
        ){
            resolve(true);
            return;
        }

        const script =
            document.createElement("script");

        script.src =
            "https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js";

        script.onload = function(){

            resolve(true);

        };

        script.onerror = function(){

            reject(
                new Error(
                    "AI library load হয়নি"
                )
            );

        };

        document.head.appendChild(script);

    });

    return mediaPipePromise;

}


/* =========================================
   INITIALIZE AI
========================================= */

function initializeAI(){

    if(selfieSegmentation){
        return Promise.resolve();
    }

    return loadMediaPipe().then(function(){

        selfieSegmentation =
            new SelfieSegmentation({

                locateFile: function(file){

                    return (
                        "https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/" +
                        file
                    );

                }

            });

        selfieSegmentation.setOptions({

            modelSelection: 0

        });

        aiReady = true;

    });

}


/* =========================================
   DESTINATION CLICK
========================================= */

document
.querySelectorAll(".destination-card")
.forEach(function(card){

    card.addEventListener(
        "click",
        function(){

            const place =
                card.getAttribute("data-place");

            startCamera(place);

        }
    );

});


/* =========================================
   START CAMERA
========================================= */

async function startCamera(place){

    currentPlace = place;

    const destination =
        destinations[place];

    cameraTitle.textContent =
        destination.name;

    homeScreen.style.display =
        "none";

    resultScreen.style.display =
        "none";

    cameraScreen.style.display =
        "block";

    cameraLoading.style.display =
        "none";

    try{

        if(
            !window.isSecureContext &&
            location.hostname !== "localhost"
        ){

            throw new Error(
                "Camera requires HTTPS"
            );

        }

        if(
            !navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia
        ){

            throw new Error(
                "Camera API unavailable"
            );

        }

        currentStream =
            await navigator.mediaDevices.getUserMedia({

                video: {
                    facingMode: {
                        ideal: "user"
                    },

                    width: {
                        ideal: 1280
                    },

                    height: {
                        ideal: 720
                    }
                },

                audio: false

            });

        cameraVideo.srcObject =
            currentStream;

        await cameraVideo.play();

        /*
         * IMPORTANT:
         * Camera already open.
         * এখন AI background-এ load হবে।
         * User camera screen-এ থাকতেই
         * library প্রস্তুত হবে।
         */

        initializeAI()
        .catch(function(error){

            console.warn(
                "AI preload failed:",
                error
            );

        });

    }
    catch(error){

        console.error(error);

        alert(
            "ক্যামেরা চালু করা যাচ্ছে না। ব্রাউজারে Camera Permission Allow করুন।"
        );

        stopCameraOnly();

        cameraScreen.style.display =
            "none";

        homeScreen.style.display =
            "block";

    }

}


/* =========================================
   CAPTURE PHOTO
========================================= */

captureButton.addEventListener(
    "click",
    capturePhoto
);


captureButton.addEventListener(
    "touchend",
    function(event){

        event.preventDefault();

        capturePhoto();

    },
    {
        passive:false
    }
);


async function capturePhoto(){

    if(!cameraVideo.videoWidth){

        alert(
            "ক্যামেরা এখনও প্রস্তুত হয়নি। এক সেকেন্ড পরে আবার চেষ্টা করুন।"
        );

        return;

    }

    captureButton.disabled =
        true;

    cameraLoading.style.display =
        "flex";

    loadingText.textContent =
        "ছবি প্রস্তুত হচ্ছে...";


    try{

        /*
         * =====================================
         * STEP 1
         * Small AI source image
         * =====================================
         */

        const originalWidth =
            cameraVideo.videoWidth;

        const originalHeight =
            cameraVideo.videoHeight;

        const MAX_SIZE = 480;

        const scale =
            Math.min(
                1,
                MAX_SIZE /
                Math.max(
                    originalWidth,
                    originalHeight
                )
            );

        const sourceCanvas =
            document.createElement("canvas");

        sourceCanvas.width =
            Math.max(
                1,
                Math.round(
                    originalWidth *
                    scale
                )
            );

        sourceCanvas.height =
            Math.max(
                1,
                Math.round(
                    originalHeight *
                    scale
                )
            );

        const sourceCtx =
            sourceCanvas.getContext("2d");

        /*
         * Camera preview is mirrored,
         * therefore capture also mirrored.
         */

        sourceCtx.save();

        sourceCtx.translate(
            sourceCanvas.width,
            0
        );

        sourceCtx.scale(
            -1,
            1
        );

        sourceCtx.drawImage(

            cameraVideo,

            0,
            0,

            sourceCanvas.width,
            sourceCanvas.height

        );

        sourceCtx.restore();


        /*
         * =====================================
         * STEP 2
         * AI ready?
         * =====================================
         */

        loadingText.textContent =
            "AI background remove হচ্ছে...";


        if(!selfieSegmentation){

            await initializeAI();

        }


        /*
         * =====================================
         * STEP 3
         * Run segmentation
         * =====================================
         */

        const segmentationResult =
            await runSegmentation(
                sourceCanvas
            );


        /*
         * =====================================
         * STEP 4
         * Create transparent person
         * =====================================
         */

        const personCanvas =
            createPersonCutout(
                sourceCanvas,
                segmentationResult
            );


        /*
         * =====================================
         * STEP 5
         * Create final Bangladesh image
         * =====================================
         */

        loadingText.textContent =
            "বাংলাদেশের গন্তব্য তৈরি হচ্ছে...";


        await createFinalImage(
            personCanvas,
            destinations[currentPlace]
        );


        /*
         * =====================================
         * STEP 6
         * Stop camera
         * =====================================
         */

        stopCameraOnly();

        cameraScreen.style.display =
            "none";

        resultScreen.style.display =
            "block";


    }
    catch(error){

        console.error(
            "Capture error:",
            error
        );

        alert(
            error.message ||
            "ছবি তৈরি করা যায়নি। আবার চেষ্টা করুন।"
        );

    }
    finally{

        cameraLoading.style.display =
            "none";

        captureButton.disabled =
            false;

    }

}


/* =========================================
   RUN SEGMENTATION
========================================= */

function runSegmentation(canvas){

    return new Promise(
        function(resolve,reject){

            let finished = false;

            const timeout =
                setTimeout(
                    function(){

                        if(finished){
                            return;
                        }

                        finished = true;

                        reject(
                            new Error(
                                "AI processing করতে বেশি সময় লাগছে। আবার ছবি তুলুন।"
                            )
                        );

                    },
                    45000
                );


            selfieSegmentation.onResults(
                function(results){

                    if(finished){
                        return;
                    }

                    finished = true;

                    clearTimeout(
                        timeout
                    );

                    resolve(results);

                }
            );


            selfieSegmentation
            .send({
                image: canvas
            })
            .catch(function(error){

                if(finished){
                    return;
                }

                finished = true;

                clearTimeout(
                    timeout
                );

                reject(error);

            });

        }
    );

}


/* =========================================
   CREATE PERSON CUTOUT
========================================= */

function createPersonCutout(
    sourceCanvas,
    results
){

    const canvas =
        document.createElement("canvas");

    canvas.width =
        sourceCanvas.width;

    canvas.height =
        sourceCanvas.height;

    const ctx =
        canvas.getContext("2d");


    /*
     * Draw original image
     */

    ctx.drawImage(
        sourceCanvas,
        0,
        0
    );


    /*
     * Create mask canvas
     */

    const maskCanvas =
        document.createElement("canvas");

    maskCanvas.width =
        sourceCanvas.width;

    maskCanvas.height =
        sourceCanvas.height;

    const maskCtx =
        maskCanvas.getContext("2d");


    maskCtx.drawImage(
        results.segmentationMask,
        0,
        0,
        maskCanvas.width,
        maskCanvas.height
    );


    /*
     * Read mask pixels
     */

    const maskData =
        maskCtx.getImageData(
            0,
            0,
            maskCanvas.width,
            maskCanvas.height
        );


    /*
     * Convert mask to alpha
     */

    for(
        let i = 0;
        i < maskData.data.length;
        i += 4
    ){

        const value =
            maskData.data[i];

        /*
         * Slightly soften edge.
         */

        const alpha =
            Math.max(
                0,
                Math.min(
                    255,
                    (value - 40) * 1.5
                )
            );

        maskData.data[i] =
            255;

        maskData.data[i + 1] =
            255;

        maskData.data[i + 2] =
            255;

        maskData.data[i + 3] =
            alpha;

    }


    maskCtx.putImageData(
        maskData,
        0,
        0
    );


    /*
     * Apply mask
     */

    ctx.globalCompositeOperation =
        "destination-in";

    ctx.drawImage(
        maskCanvas,
        0,
        0
    );

    ctx.globalCompositeOperation =
        "source-over";


    return canvas;

}


/* =========================================
   FIND PERSON BOUNDS
========================================= */

function findPersonBounds(canvas){

    const ctx =
        canvas.getContext("2d");

    const imageData =
        ctx.getImageData(
            0,
            0,
            canvas.width,
            canvas.height
        );

    let minX =
        canvas.width;

    let minY =
        canvas.height;

    let maxX =
        0;

    let maxY =
        0;

    let found =
        false;


    /*
     * Scan every 4 pixels for speed.
     */

    for(
        let y = 0;
        y < canvas.height;
        y += 4
    ){

        for(
            let x = 0;
            x < canvas.width;
            x += 4
        ){

            const index =
                (
                    y *
                    canvas.width +
                    x
                ) * 4;

            const alpha =
                imageData.data[index + 3];


            if(alpha > 30){

                found = true;

                if(x < minX){
                    minX = x;
                }

                if(y < minY){
                    minY = y;
                }

                if(x > maxX){
                    maxX = x;
                }

                if(y > maxY){
                    maxY = y;
                }

            }

        }

    }


    if(!found){

        return {
            x:0,
            y:0,
            width:canvas.width,
            height:canvas.height
        };

    }


    return {

        x:minX,

        y:minY,

        width:
            maxX - minX,

        height:
            maxY - minY

    };

}


/* =========================================
   CREATE FINAL IMAGE
========================================= */

function createFinalImage(
    personCanvas,
    destination
){

    return new Promise(function(resolve,reject){

        const background =
            new Image();

        background.onload =
            function(){

                try{

                    const canvas =
                        resultCanvas;

                    const ctx =
                        canvas.getContext("2d");

                    const W =
                        canvas.width;

                    const H =
                        canvas.height;


                    /*
                     * Background
                     */

                    drawCover(
                        ctx,
                        background,
                        0,
                        0,
                        W,
                        H
                    );


                    /*
                     * Find person
                     */

                    const bounds =
                        findPersonBounds(
                            personCanvas
                        );


                    /*
                     * Crop person
                     */

                    const cropCanvas =
                        document.createElement(
                            "canvas"
                        );

                    cropCanvas.width =
                        bounds.width;

                    cropCanvas.height =
                        bounds.height;

                    const cropCtx =
                        cropCanvas.getContext(
                            "2d"
                        );


                    cropCtx.drawImage(

                        personCanvas,

                        bounds.x,
                        bounds.y,

                        bounds.width,
                        bounds.height,

                        0,
                        0,

                        bounds.width,
                        bounds.height

                    );


                    /*
                     * Person size
                     */

                    const maxPersonHeight =
                        H * 0.78;

                    const personScale =
                        Math.min(

                            maxPersonHeight /
                            cropCanvas.height,

                            (W * 0.82) /
                            cropCanvas.width

                        );


                    const personWidth =
                        cropCanvas.width *
                        personScale;

                    const personHeight =
                        cropCanvas.height *
                        personScale;


                    const personX =
                        (W - personWidth) / 2;


                    const personY =
                        H -
                        personHeight -
                        115;


                    /*
                     * Shadow
                     */

                    ctx.save();

                    ctx.shadowColor =
                        "rgba(0,0,0,.45)";

                    ctx.shadowBlur =
                        30;

                    ctx.shadowOffsetY =
                        15;


                    ctx.drawImage(

                        cropCanvas,

                        personX,
                        personY,

                        personWidth,
                        personHeight

                    );

                    ctx.restore();


                    /*
                     * Bottom gradient
                     */

                    const gradient =
                        ctx.createLinearGradient(

                            0,
                            H * 0.68,
                            0,
                            H

                        );

                    gradient.addColorStop(
                        0,
                        "rgba(0,0,0,0)"
                    );

                    gradient.addColorStop(
                        1,
                        "rgba(0,0,0,.75)"
                    );


                    ctx.fillStyle =
                        gradient;

                    ctx.fillRect(
                        0,
                        H * 0.68,
                        W,
                        H * 0.32
                    );


                    /*
                     * Destination name
                     */

                    ctx.fillStyle =
                        "#ffffff";

                    ctx.textAlign =
                        "center";

                    ctx.font =
                        "bold 58px Arial";

                    ctx.fillText(

                        destination.name,

                        W / 2,
                        H - 60

                    );


                    /*
                     * Small footer
                     */

                    ctx.font =
                        "bold 22px Arial";

                    ctx.fillText(

                        "ইন্সট্যান্ট বাংলাদেশ টুর",

                        W / 2,
                        H - 25

                    );


                    resolve();

                }
                catch(error){

                    reject(error);

                }

            };


        background.onerror =
            function(){

                reject(
                    new Error(
                        "Destination image load হয়নি।"
                    )
                );

            };


        background.src =
            destination.image;

    });

}


/* =========================================
   DRAW COVER
========================================= */

function drawCover(
    ctx,
    image,
    x,
    y,
    width,
    height
){

    const imageRatio =
        image.width /
        image.height;

    const boxRatio =
        width /
        height;

    let drawWidth;
    let drawHeight;
    let drawX;
    let drawY;


    if(imageRatio > boxRatio){

        drawHeight =
            height;

        drawWidth =
            height *
            imageRatio;

        drawX =
            x +
            (width - drawWidth) / 2;

        drawY =
            y;

    }
    else{

        drawWidth =
            width;

        drawHeight =
            width /
            imageRatio;

        drawX =
            x;

        drawY =
            y +
            (height - drawHeight) / 2;

    }


    ctx.drawImage(

        image,

        drawX,
        drawY,

        drawWidth,
        drawHeight

    );

}


/* =========================================
   STOP CAMERA
========================================= */

function stopCameraOnly(){

    if(currentStream){

        currentStream
        .getTracks()
        .forEach(function(track){

            track.stop();

        });

        currentStream =
            null;

    }

    cameraVideo.srcObject =
        null;

}


/* =========================================
   CLOSE CAMERA
========================================= */

closeCamera.addEventListener(
    "click",
    function(){

        stopCameraOnly();

        cameraScreen.style.display =
            "none";

        homeScreen.style.display =
            "block";

    }
);


/* =========================================
   AGAIN
========================================= */

againButton.addEventListener(
    "click",
    function(){

        resultScreen.style.display =
            "none";

        startCamera(
            currentPlace
        );

    }
);


/* =========================================
   SAVE IMAGE
========================================= */

saveButton.addEventListener(
    "click",
    function(){

        const link =
            document.createElement("a");

        link.download =
            "instant-bangladesh-tour.png";

        link.href =
            resultCanvas.toDataURL(
                "image/png"
            );

        link.click();

    }
);

</script>
