<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Instant Bangladesh Tour</title>

    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            font-family: "Noto Sans Bengali", sans-serif;
            background: #f5f7f8;
            color: #111;
        }

        body {
            overflow-x: hidden;
        }

        /* =========================
           HOME
        ========================= */

        .hero {
            width: 100%;
            min-height: 100vh;
            background-image:
                linear-gradient(rgba(0,0,0,.35), rgba(0,0,0,.45)),
                url("images/hero.jpg");
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
        }

        .hero-content {
            width: 100%;
            max-width: 1000px;
            text-align: center;
            color: white;
        }

        .hero-content h1 {
            font-size: clamp(38px, 8vw, 80px);
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 15px;
        }

        .hero-content p {
            font-size: clamp(18px, 3vw, 28px);
            margin-bottom: 40px;
            font-weight: 500;
        }

        .destination-grid {
            width: 100%;
            max-width: 900px;
            margin: auto;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
        }

        .destination-card {
            position: relative;
            height: 300px;
            border-radius: 18px;
            overflow: hidden;
            cursor: pointer;
            border: 2px solid rgba(255,255,255,.5);
            background: #222;
            box-shadow: 0 10px 30px rgba(0,0,0,.3);
            transition: transform .2s ease;
        }

        .destination-card:active {
            transform: scale(.97);
        }

        .destination-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .destination-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(
                transparent 35%,
                rgba(0,0,0,.8)
            );
            display: flex;
            justify-content: flex-end;
            flex-direction: column;
            padding: 20px;
            color: white;
            text-align: left;
        }

        .destination-overlay h2 {
            font-size: 26px;
            margin-bottom: 4px;
        }

        .destination-overlay p {
            font-size: 14px;
            opacity: .9;
        }

        /* =========================
           CAMERA SCREEN
        ========================= */

        #cameraScreen {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: none;
            z-index: 9999;
            overflow: hidden;
        }

        #cameraVideo {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #000;
        }

        .camera-top {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding:
                calc(18px + env(safe-area-inset-top))
                20px
                18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100000;
            background: linear-gradient(
                rgba(0,0,0,.55),
                transparent
            );
        }

        #cameraTitle {
            color: white;
            font-size: 18px;
            font-weight: 700;
        }

        #closeCamera {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 0;
            background: rgba(0,0,0,.5);
            color: white;
            font-size: 25px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
        }

        .camera-loading {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            color: white;
            background: rgba(0,0,0,.65);
            padding: 14px 20px;
            border-radius: 10px;
            font-size: 16px;
            z-index: 100001;
            text-align: center;
        }

        /* IMPORTANT:
           পুরো capture-area এখন touch/click গ্রহণ করবে
        */

        .capture-area {
            position: absolute;
            left: 0;
            bottom: 0;
            width: 100%;
            padding-bottom: calc(35px + env(safe-area-inset-bottom));
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100000;
            pointer-events: auto;
        }

        #captureButton {
            width: 84px;
            height: 84px;
            border-radius: 50%;
            border: 6px solid white;
            background: white;
            padding: 0;
            margin: 0;
            cursor: pointer;
            pointer-events: auto;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            box-shadow:
                0 0 0 4px rgba(0,0,0,.25),
                0 5px 20px rgba(0,0,0,.35);
        }

        #captureButton:active {
            transform: scale(.92);
        }

        #captureButton:disabled {
            opacity: .6;
        }

        /* =========================
           RESULT SCREEN
        ========================= */

        #resultScreen {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            background: #111;
            display: none;
            z-index: 20000;
            overflow-y: auto;
        }

        .result-wrapper {
            width: 100%;
            min-height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        #resultCanvas {
            width: 100%;
            max-width: 600px;
            height: auto;
            display: block;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,.5);
        }

        .result-buttons {
            width: 100%;
            max-width: 600px;
            display: flex;
            gap: 12px;
            margin-top: 18px;
        }

        .result-buttons button {
            flex: 1;
            min-height: 52px;
            border: 0;
            border-radius: 10px;
            font-family: inherit;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            touch-action: manipulation;
        }

        #saveButton {
            background: white;
            color: #111;
        }

        #againButton {
            background: #2d7cff;
            color: white;
        }

        @media (max-width: 700px) {

            .hero {
                padding: 30px 15px;
            }

            .destination-grid {
                grid-template-columns: 1fr;
                max-width: 500px;
            }

            .destination-card {
                height: 220px;
            }

            .hero-content p {
                margin-bottom: 25px;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         HOME PAGE
    ========================= -->

    <section class="hero">

        <div class="hero-content">

            <h1>বাংলাদেশ টুর</h1>

            <p>
                স্ক্যান করলেই ইন্সট্যান্ট বাংলাদেশ টুর
            </p>

            <div class="destination-grid">

                <!-- Cox's Bazar -->

                <div
                    class="destination-card"
                    onclick="startCamera('cox')"
                >

                    <img
                        src="images/coxs-bazar.jpg"
                        alt="কক্সবাজার"
                    >

                    <div class="destination-overlay">

                        <h2>কক্সবাজার</h2>

                        <p>
                            সমুদ্রের সৌন্দর্যে নিজেকে দেখুন
                        </p>

                    </div>

                </div>


                <!-- Sylhet -->

                <div
                    class="destination-card"
                    onclick="startCamera('sylhet')"
                >

                    <img
                        src="images/sylhet.jpg"
                        alt="সিলেট"
                    >

                    <div class="destination-overlay">

                        <h2>সিলেট</h2>

                        <p>
                            সবুজের মাঝে নিজের ছবি তুলুন
                        </p>

                    </div>

                </div>


                <!-- Sundarbans -->

                <div
                    class="destination-card"
                    onclick="startCamera('sundarbans')"
                >

                    <img
                        src="images/sundarbans.jpg"
                        alt="সুন্দরবন"
                    >

                    <div class="destination-overlay">

                        <h2>সুন্দরবন</h2>

                        <p>
                            প্রকৃতির গভীরে নিজেকে দেখুন
                        </p>

                    </div>

                </div>

            </div>

        </div>

    </section>


    <!-- =========================
         CAMERA
    ========================= -->

    <section id="cameraScreen">

        <video
            id="cameraVideo"
            autoplay
            muted
            playsinline
        ></video>


        <div class="camera-top">

            <div id="cameraTitle">
                📍 বাংলাদেশ
            </div>

            <button
                type="button"
                id="closeCamera"
                aria-label="ক্যামেরা বন্ধ করুন"
            >
                ×
            </button>

        </div>


        <div
            id="cameraLoading"
            class="camera-loading"
        >
            ক্যামেরা চালু হচ্ছে...
        </div>


        <div class="capture-area">

            <button
                type="button"
                id="captureButton"
                aria-label="ছবি তুলুন"
                onclick="capturePhoto()"
            ></button>

        </div>

    </section>


    <!-- =========================
         RESULT
    ========================= -->

    <section id="resultScreen">

        <div class="result-wrapper">

            <canvas
                id="resultCanvas"
                width="1080"
                height="1350"
            ></canvas>

            <div class="result-buttons">

                <button
                    type="button"
                    id="saveButton"
                >
                    ছবি সেভ করুন
                </button>

                <button
                    type="button"
                    id="againButton"
                >
                    আবার ছবি তুলুন
                </button>

            </div>

        </div>

    </section>


    <!-- =========================
         JAVASCRIPT
    ========================= -->

    <script>

        /* -------------------------
           ELEMENTS
        ------------------------- */

        const cameraScreen =
            document.getElementById("cameraScreen");

        const cameraVideo =
            document.getElementById("cameraVideo");

        const cameraTitle =
            document.getElementById("cameraTitle");

        const cameraLoading =
            document.getElementById("cameraLoading");

        const captureButton =
            document.getElementById("captureButton");

        const closeCamera =
            document.getElementById("closeCamera");

        const resultScreen =
            document.getElementById("resultScreen");

        const resultCanvas =
            document.getElementById("resultCanvas");

        const saveButton =
            document.getElementById("saveButton");

        const againButton =
            document.getElementById("againButton");


        /* -------------------------
           VARIABLES
        ------------------------- */

        let stream = null;

        let selectedPlace = null;

        let capturedCanvas = null;

        let isCapturing = false;


        /* -------------------------
           DESTINATIONS
        ------------------------- */

        const places = {

            cox: {
                name: "কক্সবাজার",
                image: "images/coxs-bazar.jpg"
            },

            sylhet: {
                name: "সিলেট",
                image: "images/sylhet.jpg"
            },

            sundarbans: {
                name: "সুন্দরবন",
                image: "images/sundarbans.jpg"
            }

        };


        /* -------------------------
           START CAMERA
        ------------------------- */

        async function startCamera(place) {

            selectedPlace = place;

            capturedCanvas = null;

            isCapturing = false;

            captureButton.disabled = false;

            cameraTitle.innerText =
                "📍 " + places[place].name;

            cameraLoading.innerText =
                "ক্যামেরা চালু হচ্ছে...";

            cameraLoading.style.display =
                "block";

            resultScreen.style.display =
                "none";

            cameraScreen.style.display =
                "block";


            try {

                /* পুরোনো camera বন্ধ */

                if (stream) {

                    stream
                        .getTracks()
                        .forEach(track => track.stop());

                    stream = null;

                }


                /* Browser support check */

                if (
                    !navigator.mediaDevices ||
                    !navigator.mediaDevices.getUserMedia
                ) {

                    throw new Error(
                        "এই ব্রাউজারে Camera API পাওয়া যাচ্ছে না।"
                    );

                }


                /* Camera permission */

                stream =
                    await navigator.mediaDevices.getUserMedia({

                        video: {
                            facingMode: "user",
                            width: {
                                ideal: 1080
                            },
                            height: {
                                ideal: 1920
                            }
                        },

                        audio: false

                    });


                /* Video-তে camera বসানো */

                cameraVideo.srcObject =
                    stream;


                /* Video ready হওয়া পর্যন্ত অপেক্ষা */

                await new Promise(function(resolve) {

                    if (
                        cameraVideo.readyState >= 2 &&
                        cameraVideo.videoWidth > 0
                    ) {

                        resolve();

                        return;

                    }


                    cameraVideo.onloadedmetadata =
                        function() {

                            resolve();

                        };

                });


                /* Video play */

                await cameraVideo.play();


                cameraLoading.style.display =
                    "none";

            }


            catch (error) {

                console.error(
                    "Camera error:",
                    error
                );

                cameraLoading.innerText =
                    "ক্যামেরা চালু করা যায়নি। Camera Permission Allow করুন।";


                setTimeout(function() {

                    alert(
                        "ক্যামেরা চালু করা যায়নি।\n\n" +
                        "Browser-এর Camera Permission থেকে Allow করুন।"
                    );

                }, 300);

            }

        }


        /* -------------------------
           CAPTURE PHOTO
        ------------------------- */

        async function capturePhoto() {

            if (isCapturing) {
                return;
            }

            isCapturing = true;

            captureButton.disabled = true;

            cameraLoading.innerText =
                "ছবি তোলা হচ্ছে...";

            cameraLoading.style.display =
                "block";


            try {

                /* Camera আছে কিনা */

                if (!stream) {

                    throw new Error(
                        "Camera stream পাওয়া যায়নি।"
                    );

                }


                /* Video ready কিনা */

                if (
                    cameraVideo.readyState < 2 ||
                    cameraVideo.videoWidth === 0 ||
                    cameraVideo.videoHeight === 0
                ) {

                    throw new Error(
                        "Camera video এখনও প্রস্তুত নয়।"
                    );

                }


                /* Camera image canvas */

                const canvas =
                    document.createElement("canvas");

                canvas.width =
                    cameraVideo.videoWidth;

                canvas.height =
                    cameraVideo.videoHeight;


                const ctx =
                    canvas.getContext("2d");


                /*
                    Front camera mirror করা
                */

                ctx.save();

                ctx.translate(
                    canvas.width,
                    0
                );

                ctx.scale(-1, 1);


                ctx.drawImage(
                    cameraVideo,
                    0,
                    0,
                    canvas.width,
                    canvas.height
                );


                ctx.restore();


                capturedCanvas =
                    canvas;


                /* Camera বন্ধ */

                stopCamera();


                /* Final image তৈরি */

                await createFinalImage();

            }


            catch (error) {

                console.error(
                    "Capture error:",
                    error
                );


                alert(
                    "ছবি তোলার সময় সমস্যা হয়েছে।\n\n" +
                    error.message
                );


                isCapturing = false;

                captureButton.disabled =
                    false;

                cameraLoading.style.display =
                    "none";

            }

        }


        /* -------------------------
           STOP CAMERA
        ------------------------- */

        function stopCamera() {

            if (stream) {

                stream
                    .getTracks()
                    .forEach(track => track.stop());

                stream = null;

            }

            cameraVideo.srcObject =
                null;

            cameraScreen.style.display =
                "none";

        }


        /* -------------------------
           CREATE FINAL IMAGE
        ------------------------- */

        async function createFinalImage() {

            if (!capturedCanvas) {

                throw new Error(
                    "Captured photo পাওয়া যায়নি।"
                );

            }


            const place =
                places[selectedPlace];


            const background =
                new Image();


            background.src =
                place.image;


            await new Promise(
                function(resolve, reject) {

                    background.onload =
                        function() {

                            resolve();

                        };

                    background.onerror =
                        function() {

                            reject(
                                new Error(
                                    "Destination image load হয়নি: " +
                                    place.image
                                )
                            );

                        };

                }
            );


            const canvas =
                resultCanvas;

            const ctx =
                canvas.getContext("2d");


            /* Final canvas */

            canvas.width =
                1080;

            canvas.height =
                1350;


            /* -------------------------
               Background
            ------------------------- */

            drawCover(
                ctx,
                background,
                0,
                0,
                1080,
                1350
            );


            /* -------------------------
               Slight dark overlay
            ------------------------- */

            ctx.fillStyle =
                "rgba(0,0,0,0.15)";

            ctx.fillRect(
                0,
                0,
                1080,
                1350
            );


            /* -------------------------
               Camera photo
            ------------------------- */

            drawContain(
                ctx,
                capturedCanvas,
                60,
                120,
                960,
                1050
            );


            /* -------------------------
               Bottom gradient
            ------------------------- */

            const gradient =
                ctx.createLinearGradient(
                    0,
                    950,
                    0,
                    1350
                );


            gradient.addColorStop(
                0,
                "rgba(0,0,0,0)"
            );

            gradient.addColorStop(
                1,
                "rgba(0,0,0,.8)"
            );


            ctx.fillStyle =
                gradient;

            ctx.fillRect(
                0,
                850,
                1080,
                500
            );


            /* -------------------------
               Destination name
            ------------------------- */

            ctx.fillStyle =
                "#ffffff";

            ctx.font =
                "800 58px 'Noto Sans Bengali', sans-serif";

            ctx.textAlign =
                "center";

            ctx.fillText(
                place.name,
                540,
                1220
            );


            /* -------------------------
               Footer
            ------------------------- */

            ctx.font =
                "500 28px 'Noto Sans Bengali', sans-serif";

            ctx.fillText(
                "ইন্সট্যান্ট বাংলাদেশ টুর",
                540,
                1275
            );


            /* Result show */

            resultScreen.style.display =
                "block";


            isCapturing =
                false;

        }


        /* -------------------------
           DRAW COVER
        ------------------------- */

        function drawCover(
            ctx,
            image,
            x,
            y,
            width,
            height
        ) {

            const imageRatio =
                image.width /
                image.height;

            const boxRatio =
                width /
                height;


            let drawWidth;
            let drawHeight;
            let drawX;
            let drawY;


            if (imageRatio > boxRatio) {

                drawHeight =
                    height;

                drawWidth =
                    height *
                    imageRatio;

                drawX =
                    x +
                    (width - drawWidth) / 2;

                drawY =
                    y;

            }

            else {

                drawWidth =
                    width;

                drawHeight =
                    width /
                    imageRatio;

                drawX =
                    x;

                drawY =
                    y +
                    (height - drawHeight) / 2;

            }


            ctx.drawImage(
                image,
                drawX,
                drawY,
                drawWidth,
                drawHeight
            );

        }


        /* -------------------------
           DRAW CONTAIN
        ------------------------- */

        function drawContain(
            ctx,
            image,
            x,
            y,
            width,
            height
        ) {

            const imageRatio =
                image.width /
                image.height;

            const boxRatio =
                width /
                height;


            let drawWidth;
            let drawHeight;
            let drawX;
            let drawY;


            if (imageRatio > boxRatio) {

                drawWidth =
                    width;

                drawHeight =
                    width /
                    imageRatio;

                drawX =
                    x;

                drawY =
                    y +
                    (height - drawHeight) / 2;

            }

            else {

                drawHeight =
                    height;

                drawWidth =
                    height *
                    imageRatio;

                drawX =
                    x +
                    (width - drawWidth) / 2;

                drawY =
                    y;

            }


            ctx.drawImage(
                image,
                drawX,
                drawY,
                drawWidth,
                drawHeight
            );

        }


        /* -------------------------
           CLOSE CAMERA
        ------------------------- */

        closeCamera.addEventListener(
            "click",
            function() {

                stopCamera();

                isCapturing =
                    false;

                captureButton.disabled =
                    false;

            }
        );


        /* -------------------------
           SAVE IMAGE
        ------------------------- */

        saveButton.addEventListener(
            "click",
            function() {

                const link =
                    document.createElement("a");

                link.download =
                    "instant-bangladesh-tour.png";

                link.href =
                    resultCanvas.toDataURL(
                        "image/png"
                    );

                link.click();

            }
        );


        /* -------------------------
           AGAIN
        ------------------------- */

        againButton.addEventListener(
            "click",
            function() {

                resultScreen.style.display =
                    "none";

                isCapturing =
                    false;

                captureButton.disabled =
                    false;

                if (selectedPlace) {

                    startCamera(
                        selectedPlace
                    );

                }

            }
        );


        /* -------------------------
           EXTRA MOBILE SAFETY
        ------------------------- */

        /*
            HTML button-এ onclick="capturePhoto()"
            ইতিমধ্যেই আছে।

            নিচের touchstart শুধু mobile-এর
            জন্য অতিরিক্ত fallback।
        */

        captureButton.addEventListener(
            "touchstart",
            function(event) {

                event.preventDefault();

                event.stopPropagation();

                if (isCapturing) {
                    return;
                }

                capturePhoto();

            },
            {
                passive: false
            }
        );


        /* -------------------------
           DESKTOP CLICK FALLBACK
        ------------------------- */

        captureButton.addEventListener(
            "click",
            function(event) {

                event.preventDefault();

                event.stopPropagation();

                if (isCapturing) {
                    return;
                }

                capturePhoto();

            }
        );

    </script>

</body>
</html>
