```html
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>বাংলাদেশ টুর</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    font-family: 'Noto Sans Bengali', sans-serif;
    background: #f5f5f5;
}

/* =========================
   HOME
========================= */

.hero {
    position: relative;
    height: 100vh;
    min-height: 600px;
    background: #000;
    overflow: hidden;
}

.hero img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.hero-overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,.40);
}

.hero-content {
    position: absolute;
    inset: 0;
    color: white;

    display: flex;
    flex-direction: column;

    justify-content: center;
    align-items: center;

    text-align: center;

    padding: 20px;
}

.hero h1 {
    margin: 0;
    font-size: clamp(40px, 8vw, 80px);
}

.hero p {
    font-size: 20px;
}

.hero-btn {
    padding: 14px 30px;

    border: 1px solid white;
    border-radius: 50px;

    background: transparent;

    color: white;

    font-size: 16px;

    cursor: pointer;
}


/* =========================
   DESTINATIONS
========================= */

.destinations {
    padding: 70px 20px;
}

.section-title {
    text-align: center;
    margin-bottom: 35px;
}

.section-title h2 {
    margin: 0;
    font-size: 36px;
}

.section-title p {
    color: #666;
}

.destination-grid {

    max-width: 1200px;

    margin: auto;

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 25px;

}

.card {

    background: white;

    border-radius: 18px;

    overflow: hidden;

    cursor: pointer;

    box-shadow:
        0 8px 30px
        rgba(0,0,0,.10);

}

.card img {

    width: 100%;

    height: 280px;

    object-fit: cover;

    display: block;

}

.card-content {

    padding: 20px;

}

.card h3 {

    margin: 0 0 8px;

    font-size: 26px;

}

.card p {

    margin: 0;

    color: #666;

}


/* =========================
   CAMERA SCREEN
========================= */

#cameraScreen {

    display: none;

    position: fixed;

    inset: 0;

    background: #000;

    z-index: 9999;

}

#cameraVideo {

    width: 100%;

    height: 100%;

    object-fit: cover;

}

.camera-header {

    position: absolute;

    top: 0;

    left: 0;

    width: 100%;

    padding: 25px;

    text-align: center;

    color: white;

    font-size: 20px;

    z-index: 10;

    text-shadow:
        0 2px 10px black;

}

.closeCamera {

    position: absolute;

    top: 20px;

    right: 20px;

    width: 45px;

    height: 45px;

    border-radius: 50%;

    border: 1px solid white;

    background:
        rgba(0,0,0,.4);

    color: white;

    font-size: 22px;

    z-index: 20;

}


/* =========================
   CAPTURE BUTTON
========================= */

.capture-area {

    position: absolute;

    bottom: 40px;

    left: 0;

    width: 100%;

    display: flex;

    justify-content: center;

    z-index: 50;

}

#captureButton {

    width: 82px;

    height: 82px;

    border-radius: 50%;

    border: 6px solid white;

    background: white;

    cursor: pointer;

    padding: 0;

    touch-action: manipulation;

    -webkit-tap-highlight-color:
        transparent;

    box-shadow:
        0 0 0 4px
        rgba(255,255,255,.35);

}

#captureButton:active {

    transform:
        scale(.9);

}


/* =========================
   RESULT
========================= */

#resultScreen {

    display: none;

    position: fixed;

    inset: 0;

    background: #111;

    z-index: 10000;

    overflow-y: auto;

}

.result-wrap {

    min-height: 100vh;

    padding: 25px 15px 40px;

    display: flex;

    flex-direction: column;

    align-items: center;

}

.result-wrap h2 {

    color: white;

    text-align: center;

}

#resultCanvas {

    width: min(92vw, 600px);

    height: auto;

    display: block;

    border-radius: 15px;

}

.result-buttons {

    margin-top: 25px;

}

.result-buttons button {

    padding: 13px 24px;

    margin: 5px;

    border-radius: 50px;

    font-size: 16px;

    cursor: pointer;

}

.saveBtn {

    border: none;

    background: white;

}

.againBtn {

    background: transparent;

    color: white;

    border: 1px solid white;

}


/* =========================
   MOBILE
========================= */

@media (max-width: 768px) {

    .destination-grid {

        grid-template-columns: 1fr;

    }

    .card img {

        height: 250px;

    }

}

</style>
</head>


<body>


<!-- =========================
     HERO
========================= -->

<section class="hero">

    <img
        src="images/hero.jpg"
        alt="বাংলাদেশ"
    >

    <div class="hero-overlay"></div>

    <div class="hero-content">

        <h1>
            বাংলাদেশ টুর
        </h1>

        <p>
            চলো বাংলাদেশকে নতুনভাবে দেখি
        </p>

        <button
            class="hero-btn"
            onclick="goDestinations()"
        >
            ঘুরে দেখুন
        </button>

    </div>

</section>



<!-- =========================
     DESTINATIONS
========================= -->

<section
    class="destinations"
    id="destinations"
>

    <div class="section-title">

        <h2>
            জনপ্রিয় গন্তব্য
        </h2>

        <p>
            একটি জায়গা বেছে নিন
        </p>

    </div>


    <div class="destination-grid">


        <!-- COX -->

        <div
            class="card"
            onclick="startCamera('coxs-bazar')"
        >

            <img
                src="images/coxs-bazar.jpg"
                alt="কক্সবাজার"
            >

            <div class="card-content">

                <h3>
                    কক্সবাজার
                </h3>

                <p>
                    সমুদ্রের অসীম সৌন্দর্য
                </p>

            </div>

        </div>


        <!-- SYLHET -->

        <div
            class="card"
            onclick="startCamera('sylhet')"
        >

            <img
                src="images/sylhet.jpg"
                alt="সিলেট"
            >

            <div class="card-content">

                <h3>
                    সিলেট
                </h3>

                <p>
                    সবুজ প্রকৃতির অপরূপ সৌন্দর্য
                </p>

            </div>

        </div>


        <!-- SUNDARBANS -->

        <div
            class="card"
            onclick="startCamera('sundarbans')"
        >

            <img
                src="images/sundarbans.jpg"
                alt="সুন্দরবন"
            >

            <div class="card-content">

                <h3>
                    সুন্দরবন
                </h3>

                <p>
                    প্রকৃতির বন্য সৌন্দর্য
                </p>

            </div>

        </div>


    </div>

</section>



<!-- =========================
     CAMERA
========================= -->

<div id="cameraScreen">


    <video
        id="cameraVideo"
        autoplay
        playsinline
        muted
    ></video>


    <div
        class="camera-header"
        id="cameraTitle"
    >
        ছবি তুলুন
    </div>


    <button
        class="closeCamera"
        onclick="stopCamera()"
    >
        ×
    </button>


    <div class="capture-area">

        <button
            id="captureButton"
            type="button"
        ></button>

    </div>


</div>



<!-- =========================
     RESULT
========================= -->

<div id="resultScreen">

    <div class="result-wrap">

        <h2>
            আপনার বাংলাদেশ টুর
        </h2>


        <canvas
            id="resultCanvas"
        ></canvas>


        <div class="result-buttons">

            <button
                class="saveBtn"
                onclick="savePhoto()"
            >
                ⬇ ছবি সেভ করুন
            </button>


            <button
                class="againBtn"
                onclick="againPhoto()"
            >
                ↻ আবার ছবি তুলুন
            </button>

        </div>

    </div>

</div>



<script>


/* =========================
   VARIABLES
========================= */

let stream = null;

let selectedPlace = null;

let capturedCanvas = null;


/* =========================
   DESTINATIONS
========================= */

const places = {

    "coxs-bazar": {

        name: "কক্সবাজার",

        image:
            "images/coxs-bazar.jpg"

    },


    "sylhet": {

        name: "সিলেট",

        image:
            "images/sylhet.jpg"

    },


    "sundarbans": {

        name: "সুন্দরবন",

        image:
            "images/sundarbans.jpg"

    }

};



/* =========================
   GO DESTINATIONS
========================= */

function goDestinations() {

    document
        .getElementById(
            "destinations"
        )
        .scrollIntoView({

            behavior: "smooth"

        });

}



/* =========================
   START CAMERA
========================= */

async function startCamera(place) {

    selectedPlace = place;


    const video =
        document.getElementById(
            "cameraVideo"
        );


    document
        .getElementById(
            "cameraTitle"
        )
        .innerText =
        "📍 " +
        places[place].name;


    document
        .getElementById(
            "cameraScreen"
        )
        .style.display =
        "block";


    try {

        stream =
            await navigator
                .mediaDevices
                .getUserMedia({

                    video: {

                        facingMode:
                            "user"

                    },

                    audio: false

                });


        video.srcObject =
            stream;


        await video.play();


    }

    catch (error) {

        alert(
            "ক্যামেরা চালু করা যায়নি। মোবাইল ব্রাউজারের Camera Permission Allow করুন।"
        );


        console.error(
            error
        );


        stopCamera();

    }

}



/* =========================
   STOP CAMERA
========================= */

function stopCamera() {


    const video =
        document.getElementById(
            "cameraVideo"
        );


    if (stream) {

        stream
            .getTracks()
            .forEach(function(track) {

                track.stop();

            });

    }


    stream = null;


    video.srcObject =
        null;


    document
        .getElementById(
            "cameraScreen"
        )
        .style.display =
        "none";

}



/* =========================
   CAPTURE
========================= */

function capturePhoto() {


    const video =
        document.getElementById(
            "cameraVideo"
        );


    if (

        video.readyState < 2 ||

        video.videoWidth === 0 ||

        video.videoHeight === 0

    ) {

        alert(
            "ক্যামেরা এখনও প্রস্তুত হয়নি। একটু অপেক্ষা করে আবার চাপুন।"
        );

        return;

    }


    const canvas =
        document.createElement(
            "canvas"
        );


    canvas.width =
        video.videoWidth;


    canvas.height =
        video.videoHeight;


    const ctx =
        canvas.getContext(
            "2d"
        );


    /*
       Front camera mirror
    */

    ctx.translate(
        canvas.width,
        0
    );


    ctx.scale(
        -1,
        1
    );


    ctx.drawImage(

        video,

        0,
        0,

        canvas.width,
        canvas.height

    );


    capturedCanvas =
        canvas;


    stopCamera();


    createFinalImage();

}



/* =========================
   CAPTURE BUTTON EVENTS
========================= */

const captureButton =
    document.getElementById(
        "captureButton"
    );


captureButton.addEventListener(

    "click",

    function() {

        capturePhoto();

    }

);


captureButton.addEventListener(

    "touchend",

    function(event) {

        event.preventDefault();

        capturePhoto();

    },

    {

        passive: false

    }

);



/* =========================
   CREATE FINAL IMAGE
========================= */

function createFinalImage() {


    if (

        !capturedCanvas ||

        !selectedPlace

    ) {

        alert(
            "ছবি পাওয়া যায়নি। আবার চেষ্টা করুন।"
        );

        return;

    }


    const background =
        new Image();


    background.onload =
        function() {


            const canvas =
                document.getElementById(
                    "resultCanvas"
                );


            const width =
                1080;


            const height =
                1350;


            canvas.width =
                width;


            canvas.height =
                height;


            const ctx =
                canvas.getContext(
                    "2d"
                );


            /* BACKGROUND */

            drawCover(

                ctx,

                background,

                0,

                0,

                width,

                height

            );


            /*
               DARK OVERLAY
            */

            ctx.fillStyle =
                "rgba(0,0,0,.20)";


            ctx.fillRect(

                0,

                0,

                width,

                height

            );


            /*
               USER PHOTO

               এখানে পুরো ক্যামেরা
               ছবি দেখানো হচ্ছে
            */

            drawContain(

                ctx,

                capturedCanvas,

                0,

                0,

                width,

                height

            );


            /*
               TITLE
            */

            ctx.fillStyle =
                "rgba(0,0,0,.55)";


            ctx.fillRect(

                0,

                height - 180,

                width,

                180

            );


            ctx.fillStyle =
                "white";


            ctx.textAlign =
                "center";


            ctx.font =
                "bold 42px Arial";


            ctx.fillText(

                "Instant Bangladesh Tour",

                width / 2,

                height - 100

            );


            ctx.font =
                "32px Arial";


            ctx.fillText(

                places[
                    selectedPlace
                ].name,

                width / 2,

                height - 45

            );


            document
                .getElementById(
                    "resultScreen"
                )
                .style.display =
                "block";


        };


    background.onerror =
        function() {

            alert(
                "Background image পাওয়া যায়নি: " +
                places[
                    selectedPlace
                ].image
            );

        };


    background.src =
        places[
            selectedPlace
        ].image;

}



/* =========================
   DRAW COVER
========================= */

function drawCover(

    ctx,

    image,

    x,

    y,

    width,

    height

) {


    const imageRatio =
        image.width /
        image.height;


    const boxRatio =
        width /
        height;


    let drawWidth;

    let drawHeight;

    let drawX;

    let drawY;


    if (

        imageRatio >

        boxRatio

    ) {

        drawHeight =
            height;


        drawWidth =
            height *
            imageRatio;


        drawX =
            x +
            (
                width -
                drawWidth
            ) / 2;


        drawY =
            y;

    }

    else {

        drawWidth =
            width;


        drawHeight =
            width /
            imageRatio;


        drawX =
            x;


        drawY =
            y +
            (
                height -
                drawHeight
            ) / 2;

    }


    ctx.drawImage(

        image,

        drawX,

        drawY,

        drawWidth,

        drawHeight

    );

}



/* =========================
   DRAW CONTAIN
========================= */

function drawContain(

    ctx,

    image,

    x,

    y,

    width,

    height

) {


    const imageRatio =
        image.width /
        image.height;


    const boxRatio =
        width /
        height;


    let drawWidth;

    let drawHeight;

    let drawX;

    let drawY;


    if (

        imageRatio >

        boxRatio

    ) {

        drawWidth =
            width;


        drawHeight =
            width /
            imageRatio;


        drawX =
            x;


        drawY =
            y +
            (
                height -
                drawHeight
            ) / 2;

    }

    else {

        drawHeight =
            height;


        drawWidth =
            height *
            imageRatio;


        drawX =
            x +
            (
                width -
                drawWidth
            ) / 2;


        drawY =
            y;

    }


    ctx.drawImage(

        image,

        drawX,

        drawY,

        drawWidth,

        drawHeight

    );

}



/* =========================
   SAVE
========================= */

function savePhoto() {


    const canvas =
        document.getElementById(
            "resultCanvas"
        );


    const link =
        document.createElement(
            "a"
        );


    link.download =
        "instant-bangladesh-tour.png";


    link.href =
        canvas.toDataURL(
            "image/png"
        );


    link.click();

}



/* =========================
   AGAIN
========================= */

function againPhoto() {


    document
        .getElementById(
            "resultScreen"
        )
        .style.display =
        "none";


    startCamera(
        selectedPlace
    );

}


</script>


</body>
</html>
