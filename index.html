<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Instant Bangladesh Tour</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            font-family: Arial, sans-serif;
            background: #000;
            overflow-x: hidden;
        }

        body {
            min-height: 100vh;
        }

        button {
            font-family: inherit;
            -webkit-tap-highlight-color: transparent;
        }

        /* =========================
           HOME SCREEN
        ========================= */

        #home-screen {
            min-height: 100vh;
            width: 100%;
            background-image:
                linear-gradient(
                    rgba(0, 0, 0, 0.38),
                    rgba(0, 0, 0, 0.55)
                ),
                url("./images/hero.jpg");

            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }

        .home-content {
            width: 100%;
            max-width: 700px;
            text-align: center;
            color: white;
        }

        .home-content h1 {
            font-size: clamp(34px, 8vw, 70px);
            font-weight: 800;
            line-height: 1.05;
            margin-bottom: 12px;
        }

        .home-content p {
            font-size: clamp(17px, 4vw, 25px);
            line-height: 1.5;
            margin-bottom: 30px;
        }

        .destination-list {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            width: 100%;
        }

        .destination-card {
            position: relative;
            border: none;
            border-radius: 18px;
            overflow: hidden;
            min-height: 170px;
            cursor: pointer;
            background: #222;
            color: white;
            padding: 0;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
            transition: transform 0.2s ease;
        }

        .destination-card:active {
            transform: scale(0.96);
        }

        .destination-card img {
            width: 100%;
            height: 100%;
            min-height: 170px;
            object-fit: cover;
            display: block;
        }

        .destination-overlay {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            padding: 40px 12px 15px;
            background:
                linear-gradient(
                    transparent,
                    rgba(0, 0, 0, 0.85)
                );
        }

        .destination-overlay h2 {
            font-size: 20px;
            font-weight: 700;
        }

        /* =========================
           TOUR SCREEN
        ========================= */

        #tour-screen {
            position: fixed;
            inset: 0;
            z-index: 5000;
            display: none;
            background: #000;
            color: white;
            overflow: hidden;
        }

        .tour-background {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
        }

        .tour-dark {
            position: absolute;
            inset: 0;
            background:
                linear-gradient(
                    rgba(0, 0, 0, 0.18),
                    rgba(0, 0, 0, 0.55)
                );
        }

        .tour-content {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding: 30px 20px 70px;
            text-align: center;
        }

        .tour-content h1 {
            font-size: clamp(32px, 9vw, 70px);
            margin-bottom: 10px;
            text-shadow: 0 3px 15px rgba(0, 0, 0, 0.6);
        }

        .tour-content p {
            font-size: 18px;
            margin-bottom: 25px;
        }

        .tour-button {
            border: none;
            background: white;
            color: #111;
            padding: 16px 30px;
            border-radius: 999px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            min-width: 190px;
        }

        .back-button {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            border: none;
            background: rgba(0, 0, 0, 0.55);
            color: white;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;
        }

        /* =========================
           CAMERA SCREEN
        ========================= */

        #camera-screen {
            position: fixed;
            inset: 0;
            z-index: 10000;
            display: none;
            background: #000;
            overflow: hidden;
        }

        #camera-video {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #000;
        }

        /*
           Important:
           The overlay itself does NOT receive touch events.
           Only its buttons do.
        */

        .camera-ui {
            position: absolute;
            inset: 0;
            z-index: 20;
            pointer-events: none;
        }

        .camera-close {
            position: absolute;
            top: 20px;
            left: 20px;

            width: 48px;
            height: 48px;

            border: none;
            border-radius: 50%;

            background: rgba(0, 0, 0, 0.55);
            color: white;

            font-size: 28px;
            line-height: 48px;
            text-align: center;

            cursor: pointer;

            pointer-events: auto;
            touch-action: manipulation;

            -webkit-user-select: none;
            user-select: none;
        }

        .camera-title {
            position: absolute;
            top: 22px;
            left: 50%;
            transform: translateX(-50%);

            color: white;
            font-size: 18px;
            font-weight: 700;

            background: rgba(0, 0, 0, 0.4);
            padding: 9px 16px;
            border-radius: 999px;

            white-space: nowrap;
        }

        .capture-area {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 35px;

            display: flex;
            justify-content: center;
            align-items: center;

            pointer-events: none;
        }

        .capture-btn {
            width: 82px;
            height: 82px;

            border-radius: 50%;
            border: 7px solid rgba(255, 255, 255, 0.85);

            background: white;

            cursor: pointer;

            pointer-events: auto;
            touch-action: manipulation;

            -webkit-user-select: none;
            user-select: none;

            -webkit-tap-highlight-color: transparent;

            box-shadow:
                0 0 0 3px rgba(0, 0, 0, 0.3),
                0 4px 20px rgba(0, 0, 0, 0.4);
        }

        .capture-btn:active {
            transform: scale(0.90);
        }

        .capture-btn:disabled {
            opacity: 0.5;
            transform: none;
        }

        /* =========================
           LOADING
        ========================= */

        #loading-screen {
            position: fixed;
            inset: 0;
            z-index: 20000;

            display: none;

            align-items: center;
            justify-content: center;

            background: rgba(0, 0, 0, 0.85);
            color: white;

            text-align: center;
        }

        .loading-box {
            padding: 30px;
        }

        .loader {
            width: 55px;
            height: 55px;

            border: 5px solid rgba(255, 255, 255, 0.25);
            border-top-color: white;

            border-radius: 50%;

            animation: spin 0.8s linear infinite;

            margin: 0 auto 20px;
        }

        .loading-box p {
            font-size: 17px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* =========================
           RESULT SCREEN
        ========================= */

        #result-screen {
            position: fixed;
            inset: 0;
            z-index: 15000;

            display: none;

            background: #111;

            overflow-y: auto;
            padding: 25px 15px 40px;
        }

        .result-wrapper {
            min-height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .result-title {
            color: white;
            font-size: 25px;
            font-weight: 700;
            margin-bottom: 20px;
            text-align: center;
        }

        #result-canvas {
            display: block;

            width: min(100%, 500px);
            height: auto;

            background: white;

            border-radius: 14px;

            box-shadow:
                0 15px 50px rgba(0, 0, 0, 0.5);
        }

        .result-buttons {
            width: min(100%, 500px);

            display: flex;
            gap: 12px;

            margin-top: 20px;
        }

        .result-button {
            flex: 1;

            border: none;
            border-radius: 999px;

            padding: 15px 12px;

            font-size: 16px;
            font-weight: 700;

            cursor: pointer;
        }

        .save-button {
            background: white;
            color: #111;
        }

        .again-button {
            background: #333;
            color: white;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .destination-list {
                grid-template-columns: 1fr;
            }

            .destination-card {
                min-height: 135px;
            }

            .destination-card img {
                min-height: 135px;
            }

            .destination-overlay h2 {
                font-size: 19px;
            }

            .tour-content {
                padding-bottom: 55px;
            }

            .capture-btn {
                width: 86px;
                height: 86px;
            }

            .result-buttons {
                flex-direction: column;
            }

            .result-button {
                width: 100%;
            }
        }

    </style>
</head>


<body>


    <!-- =========================
         HOME SCREEN
    ========================== -->

    <section id="home-screen">

        <div class="home-content">

            <h1>Instant Bangladesh Tour</h1>

            <p>
                একটি জায়গা বেছে নিন,
                তারপর ক্যামেরায় নিজেকে সেখানে দেখুন।
            </p>


            <div class="destination-list">


                <!-- COX'S BAZAR -->

                <button
                    type="button"
                    class="destination-card"
                    data-destination="coxs-bazar"
                    data-title="কক্সবাজার"
                >

                    <img
                        src="./images/coxs-bazar.jpg"
                        alt="কক্সবাজার"
                    >

                    <div class="destination-overlay">
                        <h2>কক্সবাজার</h2>
                    </div>

                </button>


                <!-- SYLHET -->

                <button
                    type="button"
                    class="destination-card"
                    data-destination="sylhet"
                    data-title="সিলেট"
                >

                    <img
                        src="./images/sylhet.jpg"
                        alt="সিলেট"
                    >

                    <div class="destination-overlay">
                        <h2>সিলেট</h2>
                    </div>

                </button>


                <!-- SUNDARBANS -->

                <button
                    type="button"
                    class="destination-card"
                    data-destination="sundarbans"
                    data-title="সুন্দরবন"
                >

                    <img
                        src="./images/sundarbans.jpg"
                        alt="সুন্দরবন"
                    >

                    <div class="destination-overlay">
                        <h2>সুন্দরবন</h2>
                    </div>

                </button>


            </div>

        </div>

    </section>


    <!-- =========================
         TOUR SCREEN
    ========================== -->

    <section id="tour-screen">

        <div
            id="tour-background"
            class="tour-background"
        ></div>

        <div class="tour-dark"></div>


        <button
            type="button"
            id="tour-back"
            class="back-button"
            aria-label="পেছনে যান"
        >
            ×
        </button>


        <div class="tour-content">

            <h1 id="tour-title">
                কক্সবাজার
            </h1>

            <p>
                এখন ক্যামেরায় নিজেকে এই জায়গায় দেখুন
            </p>

            <button
                type="button"
                id="start-camera-button"
                class="tour-button"
            >
                📷 ছবি তুলুন
            </button>

        </div>

    </section>


    <!-- =========================
         CAMERA SCREEN
    ========================== -->

    <section id="camera-screen">


        <video
            id="camera-video"
            autoplay
            playsinline
            muted
        ></video>


        <div class="camera-ui">


            <button
                type="button"
                id="camera-close"
                class="camera-close"
                aria-label="ক্যামেরা বন্ধ করুন"
            >
                ×
            </button>


            <div
                id="camera-title"
                class="camera-title"
            >
                কক্সবাজার
            </div>


            <div class="capture-area">

                <button
                    type="button"
                    id="capture-button"
                    class="capture-btn"
                    aria-label="ছবি তুলুন"
                ></button>

            </div>


        </div>

    </section>


    <!-- =========================
         LOADING SCREEN
    ========================== -->

    <section id="loading-screen">

        <div class="loading-box">

            <div class="loader"></div>

            <p>
                আপনার ছবি তৈরি হচ্ছে...
            </p>

        </div>

    </section>


    <!-- =========================
         RESULT SCREEN
    ========================== -->

    <section id="result-screen">

        <div class="result-wrapper">

            <div class="result-title">
                আপনার Instant Bangladesh Tour
            </div>


            <canvas
                id="result-canvas"
                width="1080"
                height="1350"
            ></canvas>


            <div class="result-buttons">

                <button
                    type="button"
                    id="save-button"
                    class="result-button save-button"
                >
                    ছবি Save করুন
                </button>


                <button
                    type="button"
                    id="again-button"
                    class="result-button again-button"
                >
                    আবার ছবি তুলুন
                </button>

            </div>

        </div>

    </section>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script>

        /* --------------------------------
           GLOBAL VARIABLES
        -------------------------------- */

        let selectedDestination = "";
        let selectedTitle = "";

        let cameraStream = null;
        let isTakingPhoto = false;


        /* --------------------------------
           ELEMENTS
        -------------------------------- */

        const homeScreen =
            document.getElementById("home-screen");

        const tourScreen =
            document.getElementById("tour-screen");

        const tourBackground =
            document.getElementById("tour-background");

        const tourTitle =
            document.getElementById("tour-title");

        const tourBack =
            document.getElementById("tour-back");

        const startCameraButton =
            document.getElementById("start-camera-button");

        const cameraScreen =
            document.getElementById("camera-screen");

        const cameraVideo =
            document.getElementById("camera-video");

        const cameraClose =
            document.getElementById("camera-close");

        const cameraTitle =
            document.getElementById("camera-title");

        const captureButton =
            document.getElementById("capture-button");

        const loadingScreen =
            document.getElementById("loading-screen");

        const resultScreen =
            document.getElementById("result-screen");

        const resultCanvas =
            document.getElementById("result-canvas");

        const saveButton =
            document.getElementById("save-button");

        const againButton =
            document.getElementById("again-button");


        /* --------------------------------
           DESTINATION BUTTONS
        -------------------------------- */

        const destinationCards =
            document.querySelectorAll(
                ".destination-card"
            );


        destinationCards.forEach(function(card) {

            card.addEventListener(
                "click",
                function() {

                    const destination =
                        card.getAttribute(
                            "data-destination"
                        );

                    const title =
                        card.getAttribute(
                            "data-title"
                        );

                    openTour(
                        destination,
                        title
                    );

                }
            );

        });


        /* --------------------------------
           OPEN TOUR
        -------------------------------- */

        function openTour(
            destination,
            title
        ) {

            selectedDestination =
                destination;

            selectedTitle =
                title;

            tourTitle.textContent =
                title;

            tourBackground.style.backgroundImage =
                "url('./images/" +
                destination +
                ".jpg')";

            cameraTitle.textContent =
                title;

            homeScreen.style.display =
                "none";

            resultScreen.style.display =
                "none";

            cameraScreen.style.display =
                "none";

            tourScreen.style.display =
                "block";

        }


        /* --------------------------------
           BACK TO HOME
        -------------------------------- */

        tourBack.addEventListener(
            "click",
            function() {

                closeCamera();

                tourScreen.style.display =
                    "none";

                homeScreen.style.display =
                    "flex";

            }
        );


        /* --------------------------------
           START CAMERA
        -------------------------------- */

        startCameraButton.addEventListener(
            "click",
            function() {

                openCamera();

            }
        );


        async function openCamera() {

            try {

                closeCamera();

                cameraScreen.style.display =
                    "block";

                cameraTitle.textContent =
                    selectedTitle;


                /*
                   Ask for front camera.
                */

                cameraStream =
                    await navigator.mediaDevices.getUserMedia(
                        {
                            video: {
                                facingMode: "user",

                                width: {
                                    ideal: 1080
                                },

                                height: {
                                    ideal: 1920
                                }
                            },

                            audio: false
                        }
                    );


                cameraVideo.srcObject =
                    cameraStream;


                await cameraVideo.play();


            }

            catch (error) {

                console.error(
                    "Camera Error:",
                    error
                );

                cameraScreen.style.display =
                    "none";

                alert(
                    "ক্যামেরা চালু করা যাচ্ছে না।\n\n" +
                    "Chrome-এ Camera Permission Allow করুন।"
                );

            }

        }


        /* --------------------------------
           CLOSE CAMERA
        -------------------------------- */

        function closeCamera() {

            if (cameraStream) {

                cameraStream
                    .getTracks()
                    .forEach(
                        function(track) {

                            track.stop();

                        }
                    );

                cameraStream = null;

            }


            cameraVideo.srcObject =
                null;

            cameraScreen.style.display =
                "none";

            isTakingPhoto = false;

            captureButton.disabled =
                false;

        }


        cameraClose.addEventListener(
            "click",
            function() {

                closeCamera();

                tourScreen.style.display =
                    "block";

            }
        );


        /* --------------------------------
           CAPTURE BUTTON
        -------------------------------- */

        /*
           IMPORTANT:

           এখানে inline onclick নেই।

           আমরা pointerup ব্যবহার করছি,
           যাতে Android Chrome-এর touch
           ঠিকভাবে কাজ করে।
        */

        captureButton.addEventListener(
            "pointerup",
            function(event) {

                event.preventDefault();
                event.stopPropagation();

                takePhoto();

            }
        );


        /* --------------------------------
           TAKE PHOTO
        -------------------------------- */

        function takePhoto() {

            if (isTakingPhoto) {
                return;
            }


            /*
               Camera এখনও পুরোপুরি ready না হলে
               একটু পরে আবার চেষ্টা করবে।
            */

            if (
                cameraVideo.readyState < 2 ||
                !cameraVideo.videoWidth ||
                !cameraVideo.videoHeight
            ) {

                setTimeout(
                    function() {
                        takePhoto();
                    },
                    300
                );

                return;

            }


            isTakingPhoto =
                true;

            captureButton.disabled =
                true;


            const cameraCanvas =
                document.createElement(
                    "canvas"
                );


            cameraCanvas.width =
                cameraVideo.videoWidth;

            cameraCanvas.height =
                cameraVideo.videoHeight;


            const context =
                cameraCanvas.getContext(
                    "2d"
                );


            /*
               Front camera image mirror করা হচ্ছে,
               যাতে selfie-এর মতো দেখা যায়।
            */

            context.save();

            context.translate(
                cameraCanvas.width,
                0
            );

            context.scale(
                -1,
                1
            );


            context.drawImage(
                cameraVideo,
                0,
                0,
                cameraCanvas.width,
                cameraCanvas.height
            );


            context.restore();


            closeCamera();


            createFinalPhoto(
                cameraCanvas
            );

        }


        /* --------------------------------
           CREATE FINAL PHOTO
        -------------------------------- */

        function createFinalPhoto(
            cameraCanvas
        ) {

            loadingScreen.style.display =
                "flex";


            const destinationImage =
                new Image();


            destinationImage.onload =
                function() {

                    drawFinalCanvas(
                        destinationImage,
                        cameraCanvas
                    );

                };


            destinationImage.onerror =
                function() {

                    loadingScreen.style.display =
                        "none";

                    alert(
                        "Destination image পাওয়া যাচ্ছে না।"
                    );

                    isTakingPhoto =
                        false;

                };


            destinationImage.src =
                "./images/" +
                selectedDestination +
                ".jpg";

        }


        /* --------------------------------
           DRAW FINAL CANVAS
        -------------------------------- */

        function drawFinalCanvas(
            destinationImage,
            cameraCanvas
        ) {

            const canvas =
                resultCanvas;

            const ctx =
                canvas.getContext("2d");


            /*
               Final image size
            */

            canvas.width =
                1080;

            canvas.height =
                1350;


            /*
               1. Destination background
            */

            drawCoverImage(
                ctx,
                destinationImage,
                0,
                0,
                canvas.width,
                canvas.height
            );


            /*
               2. Camera photo
            */

            const cameraArea = {
                x: 90,
                y: 150,
                width: 900,
                height: 900
            };


            drawContainImage(
                ctx,
                cameraCanvas,
                cameraArea.x,
                cameraArea.y,
                cameraArea.width,
                cameraArea.height
            );


            /*
               3. Bottom dark panel
            */

            const footerHeight =
                220;


            const footerY =
                canvas.height -
                footerHeight;


            const gradient =
                ctx.createLinearGradient(
                    0,
                    footerY - 80,
                    0,
                    canvas.height
                );


            gradient.addColorStop(
                0,
                "rgba(0,0,0,0)"
            );

            gradient.addColorStop(
                0.35,
                "rgba(0,0,0,0.65)"
            );

            gradient.addColorStop(
                1,
                "rgba(0,0,0,0.92)"
            );


            ctx.fillStyle =
                gradient;

            ctx.fillRect(
                0,
                footerY - 100,
                canvas.width,
                footerHeight + 100
            );


            /*
               4. Title
            */

            ctx.fillStyle =
                "#ffffff";

            ctx.textAlign =
                "center";

            ctx.font =
                "bold 58px Arial";

            ctx.fillText(
                selectedTitle,
                canvas.width / 2,
                footerY + 80
            );


            /*
               5. Small tagline
            */

            ctx.font =
                "32px Arial";

            ctx.fillText(
                "আমি সেখানে আছি",
                canvas.width / 2,
                footerY + 135
            );


            /*
               6. Brand line
            */

            ctx.font =
                "bold 24px Arial";

            ctx.fillText(
                "INSTANT BANGLADESH TOUR",
                canvas.width / 2,
                footerY + 180
            );


            /*
               Show result
            */

            loadingScreen.style.display =
                "none";

            resultScreen.style.display =
                "block";

            isTakingPhoto =
                false;

        }


        /* --------------------------------
           DRAW COVER IMAGE
        -------------------------------- */

        function drawCoverImage(
            ctx,
            image,
            x,
            y,
            width,
            height
        ) {

            const imageRatio =
                image.width /
                image.height;

            const boxRatio =
                width /
                height;


            let drawWidth;
            let drawHeight;
            let drawX;
            let drawY;


            if (imageRatio > boxRatio) {

                drawHeight =
                    height;

                drawWidth =
                    height *
                    imageRatio;

                drawX =
                    x +
                    (width - drawWidth) / 2;

                drawY =
                    y;

            }

            else {

                drawWidth =
                    width;

                drawHeight =
                    width /
                    imageRatio;

                drawX =
                    x;

                drawY =
                    y +
                    (height - drawHeight) / 2;

            }


            ctx.drawImage(
                image,
                drawX,
                drawY,
                drawWidth,
                drawHeight
            );

        }


        /* --------------------------------
           DRAW CONTAIN IMAGE
        -------------------------------- */

        function drawContainImage(
            ctx,
            image,
            x,
            y,
            width,
            height
        ) {

            const imageRatio =
                image.width /
                image.height;

            const boxRatio =
                width /
                height;


            let drawWidth;
            let drawHeight;
            let drawX;
            let drawY;


            if (imageRatio > boxRatio) {

                drawWidth =
                    width;

                drawHeight =
                    width /
                    imageRatio;

                drawX =
                    x;

                drawY =
                    y +
                    (height - drawHeight) / 2;

            }

            else {

                drawHeight =
                    height;

                drawWidth =
                    height *
                    imageRatio;

                drawX =
                    x +
                    (width - drawWidth) / 2;

                drawY =
                    y;

            }


            /*
               White border around camera photo
            */

            ctx.save();

            ctx.fillStyle =
                "#ffffff";

            ctx.shadowColor =
                "rgba(0,0,0,0.45)";

            ctx.shadowBlur =
                25;

            ctx.fillRect(
                drawX - 8,
                drawY - 8,
                drawWidth + 16,
                drawHeight + 16
            );

            ctx.restore();


            ctx.drawImage(
                image,
                drawX,
                drawY,
                drawWidth,
                drawHeight
            );

        }


        /* --------------------------------
           SAVE PHOTO
        -------------------------------- */

        saveButton.addEventListener(
            "click",
            function() {

                savePhoto();

            }
        );


        function savePhoto() {

            const image =
                resultCanvas.toDataURL(
                    "image/png"
                );


            const link =
                document.createElement(
                    "a"
                );


            link.href =
                image;

            link.download =
                "instant-bangladesh-tour-" +
                selectedDestination +
                ".png";


            document.body.appendChild(
                link
            );


            link.click();


            document.body.removeChild(
                link
            );

        }


        /* --------------------------------
           TAKE ANOTHER PHOTO
        -------------------------------- */

        againButton.addEventListener(
            "click",
            function() {

                resultScreen.style.display =
                    "none";

                openCamera();

            }
        );


        /* --------------------------------
           PREVENT SCREEN SLEEP / EXTRA
        -------------------------------- */

        document.addEventListener(
            "visibilitychange",
            function() {

                if (
                    document.hidden &&
                    cameraStream
                ) {

                    closeCamera();

                }

            }
        );


    </script>
