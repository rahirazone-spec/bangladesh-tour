<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instant Bangladesh Tour</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial, "Noto Sans Bengali", sans-serif;
    background:#07120f;
    color:white;
}

.screen{
    min-height:100vh;
    display:none;
}

.screen.active{
    display:flex;
}

/* ================= HOME ================= */

#homeScreen{
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:30px 20px;
    background:
        radial-gradient(circle at top,#164c3b,#07120f 65%);
}

.logo{
    font-size:14px;
    letter-spacing:4px;
    opacity:.7;
    margin-bottom:15px;
}

.mainTitle{
    font-size:42px;
    font-weight:800;
    text-align:center;
    margin-bottom:10px;
}

.subTitle{
    font-size:18px;
    opacity:.8;
    text-align:center;
    margin-bottom:35px;
}

.destinationGrid{
    width:100%;
    max-width:900px;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
}

.destination{
    height:300px;
    border-radius:20px;
    overflow:hidden;
    position:relative;
    cursor:pointer;
    border:1px solid rgba(255,255,255,.2);
    transition:.25s;
}

.destination:hover{
    transform:translateY(-5px);
}

.destination img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.destinationOverlay{
    position:absolute;
    inset:0;
    background:linear-gradient(
        transparent 35%,
        rgba(0,0,0,.85)
    );
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    padding:22px;
}

.destinationName{
    font-size:27px;
    font-weight:bold;
}

.destinationHint{
    font-size:13px;
    margin-top:5px;
    opacity:.75;
}

/* ================= CAMERA ================= */

#cameraScreen{
    position:relative;
    flex-direction:column;
    background:#000;
}

#cameraVideo{
    width:100%;
    height:100vh;
    object-fit:cover;
}

.cameraTop{
    position:absolute;
    top:0;
    left:0;
    right:0;
    padding:20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:linear-gradient(
        rgba(0,0,0,.7),
        transparent
    );
}

.cameraTitle{
    font-size:18px;
    font-weight:bold;
}

.closeButton{
    width:42px;
    height:42px;
    border:1px solid rgba(255,255,255,.4);
    border-radius:50%;
    background:rgba(0,0,0,.45);
    color:white;
    font-size:22px;
}

.cameraBottom{
    position:absolute;
    bottom:0;
    left:0;
    right:0;
    padding:30px;
    display:flex;
    justify-content:center;
    background:linear-gradient(
        transparent,
        rgba(0,0,0,.8)
    );
}

.captureButton{
    width:78px;
    height:78px;
    border-radius:50%;
    border:6px solid white;
    background:white;
    box-shadow:0 0 0 5px rgba(255,255,255,.25);
}

/* ================= RESULT ================= */

#resultScreen{
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:#050908;
}

.resultTitle{
    font-size:20px;
    margin-bottom:15px;
}

#resultCanvas{
    width:min(92vw,500px);
    height:auto;
    display:block;
    border-radius:12px;
    box-shadow:0 20px 60px rgba(0,0,0,.6);
}

.resultButtons{
    display:flex;
    gap:12px;
    margin-top:20px;
}

.actionButton{
    border:0;
    padding:14px 24px;
    border-radius:30px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.saveButton{
    background:white;
    color:#07120f;
}

.againButton{
    background:#1c332c;
    color:white;
}

/* ================= MOBILE ================= */

@media(max-width:700px){

    .mainTitle{
        font-size:32px;
    }

    .destinationGrid{
        grid-template-columns:1fr;
        max-width:420px;
    }

    .destination{
        height:180px;
    }

}
</style>
</head>

<body>

<!-- ================= HOME ================= -->

<section id="homeScreen" class="screen active">

    <div class="logo">BANGLADESH TOUR 2026</div>

    <h1 class="mainTitle">
        ইন্সট্যান্ট বাংলাদেশ টুর
    </h1>

    <p class="subTitle">
        গন্তব্য বেছে নিন · ক্যামেরা খুলুন · মুহূর্তটি ধরে রাখুন
    </p>

    <div class="destinationGrid">

        <div class="destination" onclick="openCamera('cox')">
            <img src="images/cox-bazar.jpg">
            <div class="destinationOverlay">
                <div class="destinationName">কক্সবাজার</div>
                <div class="destinationHint">সমুদ্রের শহর</div>
            </div>
        </div>

        <div class="destination" onclick="openCamera('sylhet')">
            <img src="images/sylhet.jpg">
            <div class="destinationOverlay">
                <div class="destinationName">সিলেট</div>
                <div class="destinationHint">প্রকৃতির সবুজে</div>
            </div>
        </div>

        <div class="destination" onclick="openCamera('sundarbans')">
            <img src="images/sundarbans.jpg">
            <div class="destinationOverlay">
                <div class="destinationName">সুন্দরবন</div>
                <div class="destinationHint">বনের গভীরে</div>
            </div>
        </div>

    </div>

</section>


<!-- ================= CAMERA ================= -->

<section id="cameraScreen" class="screen">

    <video
        id="cameraVideo"
        autoplay
        playsinline
        muted>
    </video>

    <div class="cameraTop">

        <div class="cameraTitle" id="cameraTitle">
            কক্সবাজার
        </div>

        <button
            class="closeButton"
            onclick="closeCamera()">
            ×
        </button>

    </div>

    <div class="cameraBottom">

        <button
            id="captureButton"
            class="captureButton"
            onclick="capturePhoto()">
        </button>

    </div>

</section>


<!-- ================= RESULT ================= -->

<section id="resultScreen" class="screen">

    <div class="resultTitle">
        আপনার Digital Travel Window
    </div>

    <canvas id="resultCanvas"></canvas>

    <div class="resultButtons">

        <button
            class="actionButton saveButton"
            onclick="savePhoto()">
            ছবি সেভ করুন
        </button>

        <button
            class="actionButton againButton"
            onclick="goHome()">
            আবার করুন
        </button>

    </div>

</section>


<script>

let stream = null;
let selectedPlace = null;

const places = {

    cox:{
        name:"কক্সবাজার",
        image:"images/cox-bazar.jpg"
    },

    sylhet:{
        name:"সিলেট",
        image:"images/sylhet.jpg"
    },

    sundarbans:{
        name:"সুন্দরবন",
        image:"images/sundarbans.jpg"
    }

};


/* ================= SCREEN ================= */

function showScreen(id){

    document.querySelectorAll(".screen")
        .forEach(screen=>{
            screen.classList.remove("active");
        });

    document.getElementById(id)
        .classList.add("active");
}


/* ================= CAMERA ================= */

async function openCamera(place){

    selectedPlace = places[place];

    document.getElementById("cameraTitle")
        .textContent = selectedPlace.name;

    showScreen("cameraScreen");

    try{

        stream = await navigator.mediaDevices.getUserMedia({

            video:{
                facingMode:"user",
                width:{
                    ideal:1280
                },
                height:{
                    ideal:1920
                }
            },

            audio:false

        });

        const video =
            document.getElementById("cameraVideo");

        video.srcObject = stream;

        await video.play();

    }catch(error){

        console.error(error);

        alert(
            "ক্যামেরা চালু করা যাচ্ছে না। ব্রাউজারে Camera Permission Allow করুন।"
        );

        showScreen("homeScreen");
    }
}


/* ================= CLOSE CAMERA ================= */

function closeCamera(){

    stopCamera();

    showScreen("homeScreen");
}


function stopCamera(){

    if(stream){

        stream.getTracks().forEach(track=>{
            track.stop();
        });

        stream = null;
    }

}


/* ================= CAPTURE ================= */

function capturePhoto(){

    const video =
        document.getElementById("cameraVideo");

    if(!video.videoWidth){

        alert("ক্যামেরা প্রস্তুত হচ্ছে। এক সেকেন্ড পরে আবার চেষ্টা করুন।");

        return;
    }

    const photoCanvas =
        document.createElement("canvas");

    photoCanvas.width = video.videoWidth;
    photoCanvas.height = video.videoHeight;

    const ctx =
        photoCanvas.getContext("2d");

    /*
       Front camera হলে ছবিটা mirror করা হচ্ছে,
       যাতে preview-এর মতোই দেখায়।
    */

    ctx.translate(photoCanvas.width,0);
    ctx.scale(-1,1);

    ctx.drawImage(
        video,
        0,
        0,
        photoCanvas.width,
        photoCanvas.height
    );

    stopCamera();

    createDigitalWindow(photoCanvas);
}


/* ================= DIGITAL WINDOW ================= */

function createDigitalWindow(userCanvas){

    const canvas =
        document.getElementById("resultCanvas");

    /*
       Instagram-style vertical travel poster
    */

    const W = 1080;
    const H = 1350;

    canvas.width = W;
    canvas.height = H;

    const ctx =
        canvas.getContext("2d");

    const destination =
        new Image();

    destination.onload = function(){

        /*
           1. Destination image full background
        */

        drawCover(
            ctx,
            destination,
            0,
            0,
            W,
            H
        );


        /*
           2. Dark futuristic overlay
        */

        const gradient =
            ctx.createLinearGradient(
                0,
                0,
                0,
                H
            );

        gradient.addColorStop(
            0,
            "rgba(0,0,0,.20)"
        );

        gradient.addColorStop(
            .55,
            "rgba(0,0,0,.25)"
        );

        gradient.addColorStop(
            1,
            "rgba(0,0,0,.88)"
        );

        ctx.fillStyle = gradient;
        ctx.fillRect(0,0,W,H);


        /*
           3. Top digital label
        */

        ctx.fillStyle =
            "rgba(255,255,255,.12)";

        ctx.fillRect(
            55,
            55,
            340,
            48
        );

        ctx.fillStyle = "white";

        ctx.font =
            "bold 20px Arial";

        ctx.fillText(
            "BANGLADESH TOUR 2026",
            75,
            87
        );


        /*
           4. Destination name
        */

        ctx.font =
            "bold 72px Arial";

        ctx.fillText(
            selectedPlace.name,
            60,
            190
        );


        /*
           5. DIGITAL WINDOW
        */

        const margin = 70;

        const winX = margin;
        const winY = 250;

        const winW = W - margin*2;
        const winH = 700;


        /*
           Shadow
        */

        ctx.shadowColor =
            "rgba(0,0,0,.7)";

        ctx.shadowBlur = 35;

        ctx.fillStyle =
            "#111";

        ctx.fillRect(
            winX,
            winY,
            winW,
            winH
        );

        ctx.shadowBlur = 0;


        /*
           User photo inside window
        */

        drawCover(
            ctx,
            userCanvas,
            winX,
            winY,
            winW,
            winH
        );


        /*
           White digital frame
        */

        ctx.strokeStyle =
            "rgba(255,255,255,.95)";

        ctx.lineWidth = 5;

        ctx.strokeRect(
            winX,
            winY,
            winW,
            winH
        );


        /*
           Futuristic corner marks
        */

        ctx.strokeStyle =
            "rgba(255,255,255,.8)";

        ctx.lineWidth = 7;

        const corner = 55;

        // top left
        ctx.beginPath();
        ctx.moveTo(winX,winY+corner);
        ctx.lineTo(winX,winY);
        ctx.lineTo(winX+corner,winY);
        ctx.stroke();

        // top right
        ctx.beginPath();
        ctx.moveTo(winX+winW-corner,winY);
        ctx.lineTo(winX+winW,winY);
        ctx.lineTo(winX+winW,winY+corner);
        ctx.stroke();

        // bottom left
        ctx.beginPath();
        ctx.moveTo(winX,winY+winH-corner);
        ctx.lineTo(winX,winY+winH);
        ctx.lineTo(winX+corner,winY+winH);
        ctx.stroke();

        // bottom right
        ctx.beginPath();
        ctx.moveTo(winX+winW-corner,winY+winH);
        ctx.lineTo(winX+winW,winY+winH);
        ctx.lineTo(winX+winW,winY+winH-corner);
        ctx.stroke();


        /*
           6. Main message
        */

        ctx.fillStyle =
            "white";

        ctx.font =
            "bold 78px Arial";

        ctx.fillText(
            "আমি সেখানে আছি",
            60,
            1080
        );


        /*
           7. Supporting copy
        */

        ctx.font =
            "28px Arial";

        ctx.fillStyle =
            "rgba(255,255,255,.75)";

        ctx.fillText(
            "দেখুন বাংলাদেশকে নতুনভাবে",
            65,
            1135
        );


        /*
           8. Digital line
        */

        ctx.fillStyle =
            "rgba(255,255,255,.5)";

        ctx.fillRect(
            65,
            1170,
            950,
            2
        );


        /*
           9. Footer
        */

        ctx.font =
            "bold 24px Arial";

        ctx.fillStyle =
            "white";

        ctx.fillText(
            "ইন্সট্যান্ট বাংলাদেশ টুর",
            65,
            1225
        );

        ctx.font =
            "20px Arial";

        ctx.fillStyle =
            "rgba(255,255,255,.6)";

        ctx.fillText(
            "SCAN • CAPTURE • EXPERIENCE",
            65,
            1265
        );


        showScreen("resultScreen");

    };


    destination.onerror = function(){

        alert(
            "Destination image load করা যাচ্ছে না।"
        );

        showScreen("homeScreen");
    };


    destination.src =
        selectedPlace.image;
}


/* ================= DRAW COVER ================= */

function drawCover(
    ctx,
    image,
    x,
    y,
    width,
    height
){

    const imageRatio =
        image.width / image.height;

    const boxRatio =
        width / height;

    let drawWidth;
    let drawHeight;

    if(imageRatio > boxRatio){

        drawHeight = height;
        drawWidth =
            height * imageRatio;

    }else{

        drawWidth = width;
        drawHeight =
            width / imageRatio;
    }

    const drawX =
        x + (width-drawWidth)/2;

    const drawY =
        y + (height-drawHeight)/2;

    ctx.drawImage(
        image,
        drawX,
        drawY,
        drawWidth,
        drawHeight
    );
}


/* ================= SAVE ================= */

function savePhoto(){

    const canvas =
        document.getElementById("resultCanvas");

    const link =
        document.createElement("a");

    link.download =
        "instant-bangladesh-tour.png";

    link.href =
        canvas.toDataURL("image/png");

    link.click();
}


/* ================= HOME ================= */

function goHome(){

    stopCamera();

    showScreen("homeScreen");
}


/* ================= PAGE EXIT ================= */

window.addEventListener(
    "beforeunload",
    stopCamera
);

</script>

</body>
</html>
