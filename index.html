```html
<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>বাংলাদেশ টুর</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #111;
        }

        .screen {
            min-height: 100vh;
            padding: 25px 18px;
            text-align: center;
        }

        h1 {
            margin: 10px 0;
            font-size: 30px;
        }

        p {
            color: #555;
            margin-bottom: 25px;
        }

        .destinations {
            display: grid;
            grid-template-columns: 1fr;
            gap: 18px;
            max-width: 500px;
            margin: auto;
        }

        .destination-card {
            background: white;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0,0,0,0.12);
            cursor: pointer;
        }

        .destination-card img {
            width: 100%;
            height: auto;
            display: block;
        }

        .destination-card h2 {
            margin: 14px;
            font-size: 22px;
        }


        /* =========================
           CAMERA SCREEN
        ========================= */

        .camera-screen {
            display: none;
            min-height: 100vh;
            background: #000;
            color: white;
            position: relative;
            overflow: hidden;
        }

        #camera {
            width: 100%;
            height: 100vh;
            object-fit: cover;
            display: block;
        }

        .camera-title {
            position: absolute;
            top: 20px;
            left: 0;
            right: 0;
            z-index: 5;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 0 2px 5px #000;
        }

        .capture-btn {
            position: absolute;
            bottom: 35px;
            left: 50%;
            transform: translateX(-50%);

            width: 72px;
            height: 72px;

            border-radius: 50%;

            border: 6px solid white;
            background: white;

            cursor: pointer;
            z-index: 20;
        }

        .capture-btn:active {
            transform: translateX(-50%) scale(0.9);
        }


        /* =========================
           RESULT SCREEN
        ========================= */

        .result-screen {
            display: none;
            min-height: 100vh;
            background: #111;
            padding: 20px;
            text-align: center;
            color: white;
        }

        .result-title {
            font-size: 24px;
            margin-bottom: 15px;
        }

        #resultCanvas {
            width: 100%;
            max-width: 500px;
            border-radius: 15px;
            display: block;
            margin: auto;
        }

        .back-btn {
            margin-top: 20px;
            padding: 13px 25px;
            border: none;
            border-radius: 30px;
            background: white;
            color: #111;
            font-size: 16px;
            cursor: pointer;
        }

    </style>
</head>


<body>


    <!-- =========================
         DESTINATION SCREEN
    ========================= -->

    <section id="homeScreen" class="screen">

        <h1>ইন্সট্যান্ট বাংলাদেশ টুর</h1>

        <p>একটি জায়গা বেছে নিন</p>


        <div class="destinations">


            <!-- COX'S BAZAR -->

            <div class="destination-card"
                 onclick="selectDestination('cox')">

                <img
                    src="images/coxs-bazar.jpg"
                    alt="কক্সবাজার"
                >

                <h2>কক্সবাজার</h2>

            </div>



            <!-- SYLHET -->

            <div class="destination-card"
                 onclick="selectDestination('sylhet')">

                <img
                    src="images/sylhet.jpg"
                    alt="সিলেট"
                >

                <h2>সিলেট</h2>

            </div>



            <!-- SUNDARBANS -->

            <div class="destination-card"
                 onclick="selectDestination('sundarbans')">

                <img
                    src="images/sundarbans.jpg"
                    alt="সুন্দরবন"
                >

                <h2>সুন্দরবন</h2>

            </div>


        </div>

    </section>



    <!-- =========================
         CAMERA SCREEN
    ========================= -->

    <section id="cameraScreen"
             class="camera-screen">


        <div class="camera-title">

            <span id="selectedPlace"></span>

        </div>


        <video
            id="camera"
            autoplay
            playsinline>
        </video>


        <button
            type="button"
            class="capture-btn"
            onclick="takePhoto()">
        </button>


    </section>



    <!-- =========================
         RESULT SCREEN
    ========================= -->

    <section id="resultScreen"
             class="result-screen">


        <div class="result-title">

            আপনার বাংলাদেশ টুর 📸

        </div>


        <canvas id="resultCanvas"></canvas>


        <button
            type="button"
            class="back-btn"
            onclick="location.reload()">

            আবার চেষ্টা করুন

        </button>


    </section>



    <script>


        /* =========================
           VARIABLES
        ========================= */

        let selectedDestination = "";
        let selectedImage = "";

        const video =
            document.getElementById("camera");



        /* =========================
           DESTINATIONS
        ========================= */

        const destinations = {

            cox: {

                name: "কক্সবাজার",

                image:
                    "images/coxs-bazar.jpg"

            },


            sylhet: {

                name: "সিলেট",

                image:
                    "images/sylhet.jpg"

            },


            sundarbans: {

                name: "সুন্দরবন",

                image:
                    "images/sundarbans.jpg"

            }

        };



        /* =========================
           SELECT DESTINATION
        ========================= */

        async function selectDestination(place) {


            selectedDestination = place;


            selectedImage =
                destinations[place].image;


            document
                .getElementById("selectedPlace")
                .innerText =
                "📍 " +
                destinations[place].name;


            document
                .getElementById("homeScreen")
                .style.display = "none";


            document
                .getElementById("cameraScreen")
                .style.display = "block";


            try {


                const stream =
                    await navigator.mediaDevices
                    .getUserMedia({

                        video: {

                            facingMode: "user"

                        },

                        audio: false

                    });


                video.srcObject = stream;


                /*
                 * Camera চালু হলে play
                 */

                await video.play();


            }

            catch (error) {


                alert(
                    "ক্যামেরা চালু করা যাচ্ছে না। Camera permission দিন।"
                );


                console.log(error);

            }

        }



        /* =========================
           TAKE PHOTO
        ========================= */

        function takePhoto() {


            /*
             * Camera এখনও ready না হলে
             * loadedmetadata-এর জন্য অপেক্ষা করবে
             */

            if (
                !video.videoWidth ||
                !video.videoHeight
            ) {


                video.addEventListener(

                    "loadedmetadata",

                    function () {

                        captureNow();

                    },

                    {
                        once: true
                    }

                );


                return;

            }


            captureNow();

        }



        /* =========================
           CAPTURE NOW
        ========================= */

        function captureNow() {


            const canvas =
                document.getElementById(
                    "resultCanvas"
                );


            const ctx =
                canvas.getContext("2d");


            const background =
                new Image();



            background.onload =
                function () {


                    /*
                     * FINAL PHOTO SIZE
                     */

                    const canvasWidth = 1080;

                    const canvasHeight = 1350;


                    canvas.width =
                        canvasWidth;

                    canvas.height =
                        canvasHeight;



                    /*
                     * =====================
                     * BACKGROUND IMAGE
                     * =====================
                     */


                    const bgRatio =
                        background.width /
                        background.height;


                    const canvasRatio =
                        canvasWidth /
                        canvasHeight;


                    let bgWidth;
                    let bgHeight;
                    let bgX;
                    let bgY;



                    if (
                        bgRatio > canvasRatio
                    ) {


                        bgHeight =
                            canvasHeight;


                        bgWidth =
                            bgHeight *
                            bgRatio;


                        bgX =
                            (
                                canvasWidth -
                                bgWidth
                            ) / 2;


                        bgY = 0;

                    }

                    else {


                        bgWidth =
                            canvasWidth;


                        bgHeight =
                            bgWidth /
                            bgRatio;


                        bgX = 0;


                        bgY =
                            (
                                canvasHeight -
                                bgHeight
                            ) / 2;

                    }



                    /*
                     * Background draw
                     */

                    ctx.drawImage(

                        background,

                        bgX,
                        bgY,

                        bgWidth,
                        bgHeight

                    );



                    /*
                     * =====================
                     * CAMERA PHOTO
                     * =====================
                     */


                    /*
                     * Camera image ছোট রাখা
                     */

                    const cameraWidth = 420;


                    const cameraRatio =
                        video.videoHeight /
                        video.videoWidth;


                    const cameraHeight =
                        cameraWidth *
                        cameraRatio;


                    /*
                     * Camera image
                     * নিচের দিকে থাকবে
                     */

                    const cameraX =
                        (
                            canvasWidth -
                            cameraWidth
                        ) / 2;


                    const cameraY =
                        canvasHeight -
                        cameraHeight -
                        100;



                    /*
                     * Camera image draw
                     */

                    ctx.drawImage(

                        video,

                        cameraX,
                        cameraY,

                        cameraWidth,
                        cameraHeight

                    );



                    /*
                     * =====================
                     * CAMERA বন্ধ
                     * =====================
                     */

                    if (
                        video.srcObject
                    ) {


                        video.srcObject
                            .getTracks()
                            .forEach(

                                function (track) {

                                    track.stop();

                                }

                            );

                    }



                    /*
                     * =====================
                     * SCREEN CHANGE
                     * =====================
                     */

                    document
                        .getElementById(
                            "cameraScreen"
                        )
                        .style.display =
                        "none";


                    document
                        .getElementById(
                            "resultScreen"
                        )
                        .style.display =
                        "block";


                };



            /*
             * Destination image load
             */

            background.src =
                selectedImage;

        }


    </script>


</body>
</html>
```
